<body class="min-h-screen antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        const DEFAULT_STANDARD_COMMENTS = [
            'Late Fees Not Paid',
            'Not Available in Bank Statement',
            'VERIFIED: Deposit Confirmed',
            'EXCUSED: Late Fee Waived',
            'FLAGGED: Partial Amount',
            'REJECTED: Invalid Receipt',
            'DUPLICATE: Double Submission',
            'Wrong Slip Attached',
            'Future Payments',
            'UNCLEAR IMAGE',
            'TRANSACTION NOT PROCESSED'
        ];

        // --- Helper Utilities ---
        const normalize = (str) => (str || "").toString().toUpperCase().trim().replace(/[^A-Z0-9\s]/g, ' ').replace(/\s+/g, ' ');

        const getTodayDDMMYYYY = () => {
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            return `${dd}/${mm}/${yyyy}`;
        };

        const formatDDMMYYYYtoYYYYMMDD = (str) => {
            if (!str) return '';
            const parts = str.toString().trim().split(/[\/\-.]/);
            if (parts.length === 3) {
                const [d, m, y] = parts;
                if (d && m && y && y.length === 4) {
                    return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
                }
            }
            return '';
        };

        const formatYYYYMMDDtoDDMMYYYY = (str) => {
            if (!str) return '';
            const parts = str.toString().trim().split('-');
            if (parts.length === 3) {
                const [y, m, d] = parts;
                return `${d.padStart(2, '0')}/${m.padStart(2, '0')}/${y}`;
            }
            return '';
        };

        const normalizeMonthString = (raw) => {
            if (!raw) return '';
            let str = raw.toString().trim();
            if (!str) return '';

            const excelAugPattern = /^(\d{2})[-/\s]?(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*$/i;
            const excelAugPattern2 = /^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-z]*[-/\s]?(\d{2})$/i;

            const monthMap = {
                jan: 'January', feb: 'February', mar: 'March', apr: 'April',
                may: 'May', jun: 'June', jul: 'July', aug: 'August',
                sep: 'September', oct: 'October', nov: 'November', dec: 'December'
            };

            let match1 = str.match(excelAugPattern);
            if (match1) {
                let yy = match1[1];
                let mShort = match1[2].toLowerCase();
                let fullYear = yy.length === 2 ? `20${yy}` : yy;
                let fullMonth = monthMap[mShort] || mShort;
                return `${fullMonth} ${fullYear}`;
            }

            let match2 = str.match(excelAugPattern2);
            if (match2) {
                let mShort = match2[1].toLowerCase();
                let yy = match2[2];
                let fullYear = yy.length === 2 ? `20${yy}` : yy;
                let fullMonth = monthMap[mShort] || mShort;
                return `${fullMonth} ${fullYear}`;
            }

            for (const [short, full] of Object.entries(monthMap)) {
                if (str.toLowerCase().includes(short)) {
                    const yearMatch = str.match(/\b(20\d{2}|\d{2})\b/);
                    let year = yearMatch ? (yearMatch[1].length === 2 ? `20${yearMatch[1]}` : yearMatch[1]) : new Date().getFullYear().toString();
                    return `${full} ${year}`;
                }
            }

            return str;
        };

        const parseDate = (val) => {
            if (!val) return null;
            if (val instanceof Date) return isNaN(val.getTime()) ? null : val;
            if (typeof val === 'number') return new Date(Math.round((val - 25569) * 86400 * 1000));
            const cleanStr = val.toString().trim();

            const isoMatch = cleanStr.match(/^(\d{4})[-/.](0?[1-9]|1[0-2])[-/.](0?[1-9]|[12]\d|3[01])/);
            if (isoMatch) {
                const y = parseInt(isoMatch[1], 10);
                const m = parseInt(isoMatch[2], 10) - 1;
                const d = parseInt(isoMatch[3], 10);
                const dObj = new Date(y, m, d);
                return isNaN(dObj.getTime()) ? null : dObj;
            }

            const dmyMatch = cleanStr.match(/^(0?[1-9]|[12]\d|3[01])[-/.](0?[1-9]|1[0-2])[-/.](\d{2,4})/);
            if (dmyMatch) {
                let d = parseInt(dmyMatch[1], 10);
                let m = parseInt(dmyMatch[2], 10) - 1;
                let y = parseInt(dmyMatch[3], 10);
                if (y < 100) y += 2000;
                const dObj = new Date(y, m, d);
                return isNaN(dObj.getTime()) ? null : dObj;
            }

            const direct = new Date(cleanStr);
            return isNaN(direct.getTime()) ? null : direct;
        };

        const getStartOfDay = (d) => {
            if (!d) return null;
            const dt = new Date(d);
            if (isNaN(dt.getTime())) return null;
            dt.setHours(0, 0, 0, 0);
            return dt;
        };

        const parseGradeNumber = (gradeStr) => {
            if (!gradeStr) return 1;
            const match = gradeStr.toString().match(/\d+/);
            return match ? parseInt(match[0], 10) : 1;
        };

        const extractIdFromSlip = (file) => {
            const fileNameMatch = file.name.match(/\b\d{2,6}\b/);
            const folder = (file.webkitRelativePath || "").split('/').reverse()[1] || "";
            const isGenericFolder = /grade|class|slip|receipt|august|september|october|november|december|january|february|march|april|may|june|july|audit|photo|image/i.test(folder);
            if (fileNameMatch) return fileNameMatch[0];
            if (folder && !isGenericFolder) {
                const folderMatch = folder.match(/\b\d{2,6}\b/);
                if (folderMatch) return folderMatch[0];
            }
            return file.name.match(/\d+/)?.[0] || "";
        };

        const isPdfFile = (slip) => {
            if (!slip) return false;
            const typeStr = (slip.type || '').toLowerCase();
            const nameStr = (slip.name || '').toLowerCase();
            return typeStr.includes('pdf') || nameStr.endsWith('.pdf');
        };

        // Advanced Image Preprocessing Canvas Helper
        const preprocessImage = (imageSource, customParams = {}) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    let width = img.width;
                    let height = img.height;
                    const maxDim = 1800;
                    if (width > maxDim || height > maxDim) {
                        if (width > height) {
                            height = Math.round((height * maxDim) / width);
                            width = maxDim;
                        } else {
                            width = Math.round((width * maxDim) / height);
                            height = maxDim;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    ctx.drawImage(img, 0, 0, width, height);

                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;

                    let contrast = customParams.contrast !== undefined ? customParams.contrast : 1.4; 
                    let brightness = customParams.brightness !== undefined ? customParams.brightness : 0;
                    let thresholdUpper = customParams.thresholdUpper !== undefined ? customParams.thresholdUpper : 160;
                    let thresholdLower = customParams.thresholdLower !== undefined ? customParams.thresholdLower : 85;

                    let factor = (259 * (contrast * 100 + 255)) / (255 * (259 - contrast * 100));

                    for (let i = 0; i < data.length; i += 4) {
                        let avg = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                        avg = avg + brightness;
                        let color = factor * (avg - 128) + 128;
                        color = color > thresholdUpper ? 255 : (color < thresholdLower ? 0 : color); 
                        data[i] = color;
                        data[i + 1] = color;
                        data[i + 2] = color;
                    }
                    ctx.putImageData(imgData, 0, 0);
                    resolve(canvas.toDataURL('image/jpeg', 0.9));
                };
                img.onerror = () => resolve(imageSource);
                img.src = imageSource;
            });
        };

        const extractSlipData = (text, currentConfig = {}) => {
            if (!text) return { amount: null, trace: null, potentialTraces: [], detectedDate: null, receiverMatched: false, accountMatched: false };

            const cleanedText = text.replace(/([0-9])O([0-9])/gi, '$10$2')
                                   .replace(/([0-9])l([0-9])/gi, '$11$2');

            const amountRegex = /(?:Rs\.?|LKR|TOTAL|AMT)?\s*([1-9][0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})?)\b/gi;
            const matches = [...cleanedText.matchAll(amountRegex)];
            const candidates = matches.map(m => parseFloat(m[1].replace(/,/g, ''))).filter(n => n >= 500 && n <= 250000);
            const amount = candidates.length > 0 ? Math.max(...candidates) : null;

            let trace = null;
            const potentialTraces = [];
            
            const traceLabelMatch = cleanedText.match(/(?:TRACE(?:\s*NO)?|SEQ(?:\s*NO)?|TXN(?:\s*NO)?|REF(?:\s*NO)?|STAN)[\s:.-]*([0-9]{4,8})\b/i);
            if (traceLabelMatch) {
                const fullTrace = traceLabelMatch[1];
                trace = fullTrace.length > 4 ? fullTrace.slice(-4) : fullTrace;
                potentialTraces.push(trace);
                if (fullTrace !== trace) potentialTraces.push(fullTrace);
            }

            let detectedDate = null;
            const dateMatch = cleanedText.match(/(\d{1,2})[/\.-](\d{1,2})[/\.-](\d{2,4})/);
            if (dateMatch) {
                detectedDate = parseDate(`${dateMatch[1]}/${dateMatch[2]}/${dateMatch[3]}`);
            }

            const configAccount = (currentConfig.depositAccountNumber || '1020023476').replace(/\s+/g, '');
            const configOwner = normalize(currentConfig.depositAccountOwner || 'H G A M R GAMAGE');
            const ownerTokens = configOwner.split(' ').filter(t => t.length > 1);

            const receiverMatched = /H\s*G\s*A\s*M\s*R\s*GAMAGE|GAMAGE\s*HGAMR|MICHAEL\s*RANUKA\s*GAMAGE/i.test(cleanedText) ||
                (ownerTokens.length > 0 && ownerTokens.every(tok => cleanedText.toUpperCase().includes(tok)));

            const accountMatched = new RegExp(configAccount).test(cleanedText.replace(/\s+/g, '')) || /1020023476/.test(cleanedText.replace(/\s+/g, ''));

            return { amount, trace, potentialTraces, detectedDate, receiverMatched, accountMatched };
        };

        const getFamilyClusterKey = (id, familyLinks) => {
            const cluster = familyLinks[id];
            if (cluster && Array.isArray(cluster)) {
                const uniqueCluster = [...new Set(cluster)].map(s => s.toString()).sort((a,b) => a.localeCompare(b, undefined, { numeric: true }));
                if (uniqueCluster.length > 1) {
                    return 'FAM-' + uniqueCluster.join('_');
                }
            }
            return 'IND-' + id;
        };

        const DB_KEY = 'audit_core_db_v23';

        const analyzeStudent = (student, cluster, bankIndex, currentConfig, fullBankList, allStudentsMap, ocrData = null) => {
            const penaltyDate = getStartOfDay(parseDate(currentConfig.lateLogicStart));
            const { amount: slipAmount, trace: slipTrace, potentialTraces = [], detectedDate: slipDate, receiverMatched = false, accountMatched = false } = ocrData || {};

            const indivGradeNum = parseGradeNumber(student.grade);
            const indivBaseFee = Number(currentConfig.gradeFees[indivGradeNum] !== undefined ? currentConfig.gradeFees[indivGradeNum] : (indivGradeNum === 1 ? 3500 : 3000));

            let familyBaseFee = 0;
            let familyMembersInfo = [];
            const uniqueCluster = [...new Set(cluster || [])];
            const seenTokens = new Set();

            uniqueCluster.forEach(memberId => {
                const mem = allStudentsMap[memberId] || (memberId === student.token ? student : null);
                if (mem && !seenTokens.has(mem.token)) {
                    seenTokens.add(mem.token);
                    const gNum = parseGradeNumber(mem.grade);
                    const feeForGrade = Number(currentConfig.gradeFees[gNum] !== undefined ? currentConfig.gradeFees[gNum] : (gNum === 1 ? 3500 : 3000));
                    familyBaseFee += feeForGrade;
                    familyMembersInfo.push({ id: mem.token, token: mem.token, name: mem.name, grade: mem.grade, baseFee: feeForGrade });
                }
            });

            let candidateTxns = [];

            // 1. Direct Token Match (100% confidence)
            cluster.forEach(cid => {
                if (bankIndex.has(cid)) {
                    bankIndex.get(cid).forEach(txn => {
                        candidateTxns.push({ ...txn, method: 'Direct Token Match', confidence: 100 });
                    });
                }
            });

            // 2. Normalized Full Name Match
            if (candidateTxns.length === 0 && student.name && student.name !== 'Unknown Student' && student.name.length > 3) {
                const cleanStudentName = normalize(student.name);
                const nameParts = cleanStudentName.split(' ').filter(p => p.length > 1);
                fullBankList.forEach(txn => {
                    if (txn.desc.includes(cleanStudentName)) {
                        candidateTxns.push({ ...txn, method: 'Exact Full Name Match', confidence: 100 });
                    } else if (nameParts.length >= 2 && nameParts.every(part => txn.desc.includes(part))) {
                        candidateTxns.push({ ...txn, method: 'Multi-part Name Match', confidence: 95 });
                    }
                });
            }

            // 3. Explicit OCR Trace Match
            if (candidateTxns.length === 0 && (slipTrace || potentialTraces.length > 0)) {
                const searchTraces = [slipTrace, ...potentialTraces].filter(Boolean);
                searchTraces.forEach(trCode => {
                    fullBankList.forEach(txn => {
                        const traceRegex = new RegExp(`\\b${trCode}\\b`, 'i');
                        if (traceRegex.test(txn.desc) || txn.desc.includes(trCode)) {
                            candidateTxns.push({ ...txn, method: `OCR TRACE #${trCode} Match`, confidence: 100 });
                        }
                    });
                });
            }

            candidateTxns = [...new Map(candidateTxns.map(item => [item.id, item])).values()].sort((a,b) => b.confidence - a.confidence);

            const totalPaid = candidateTxns.reduce((sum, t) => sum + t.amount, 0);
            const dates = candidateTxns.map(t => t.date).filter(Boolean);
            const rawEffDate = dates.length > 0 ? new Date(Math.min(...dates)) : (slipDate || student.uploadTimestamp);
            const effDateStart = getStartOfDay(rawEffDate);

            const isLateSubmission = effDateStart && penaltyDate && effDateStart >= penaltyDate;
            const requiredLateFee = isLateSubmission ? Number(currentConfig.lateFee || 500) : 0;

            const indivTotalExpected = indivBaseFee + requiredLateFee;
            const familyTotalExpected = familyBaseFee + (isLateSubmission ? requiredLateFee * Math.max(1, cluster.length) : 0);

            let expectedBaseFee = indivBaseFee;
            let totalExpected = indivTotalExpected;

            if (cluster.length > 1 && (Math.abs(totalPaid - familyTotalExpected) < 1.0 || Math.abs(totalPaid - familyBaseFee) < 1.0)) {
                expectedBaseFee = familyBaseFee;
                totalExpected = familyTotalExpected;
            }

            const has100PercentMatch = candidateTxns.length > 0 && candidateTxns.some(t => t.confidence >= 95);
            const isAmountExactlyMatched = Math.abs(totalPaid - totalExpected) < 1.0 || Math.abs(totalPaid - expectedBaseFee) < 1.0;

            let statusType = 'unmatched';
            let autoComment = "";

            let autoAccountNameVerified = receiverMatched || has100PercentMatch;
            let autoAccountNumVerified = accountMatched || has100PercentMatch;

            if (has100PercentMatch) {
                if (isAmountExactlyMatched) {
                    if (totalPaid >= totalExpected) {
                        statusType = 'confirmed';
                        autoComment = isLateSubmission 
                            ? `VERIFIED: Base Fee (Rs.${expectedBaseFee}) + Late Fee (Rs.${requiredLateFee}) fully satisfied.`
                            : `VERIFIED: Base Fee (Rs.${expectedBaseFee}) paid in full.`;
                    } else if (totalPaid >= expectedBaseFee && isLateSubmission) {
                        statusType = 'late_fee_missing';
                        autoComment = `Late Fees Not Paid`;
                    }
                } else if (totalPaid > 0) {
                    statusType = 'odd';
                    autoComment = `FLAGGED: Partial Amount (Paid Rs.${totalPaid} vs Expected Rs.${totalExpected})`;
                }
            } else if (totalPaid > 0) {
                statusType = 'odd';
                autoComment = `FLAGGED: Partial Amount (Paid Rs.${totalPaid} vs Expected Rs.${totalExpected})`;
            } else {
                statusType = 'unmatched';
                autoComment = "Not Available in Bank Statement";
            }

            const infoStr = (student.paymentInfo || "").toString().trim().toUpperCase();
            const notesStr = (student.notes || "").toString().trim();
            const normalizedMonth = normalizeMonthString(student.month);
            
            const isFuturePayment = statusType !== 'late_fee_missing' && (
                infoStr.startsWith('OTHER') || 
                /future|next month|advance|other month/i.test(notesStr) ||
                /future|next month|advance|other month/i.test(infoStr) ||
                (normalizedMonth && currentConfig.auditMonth && normalizedMonth.toLowerCase() !== currentConfig.auditMonth.toLowerCase() && normalizedMonth.length > 2)
            );

            return {
                id: student.token,
                folder: student.name,
                grade: student.grade,
                paid: totalPaid,
                statusType,
                effDate: rawEffDate,
                expected: totalExpected,
                baseExpected: expectedBaseFee,
                lateFeeAmount: requiredLateFee,
                isLateSubmission,
                matches: candidateTxns,
                link: student.link,
                forensicNote: autoComment,
                ocrAmount: slipAmount,
                ocrTrace: slipTrace,
                paymentInfo: student.paymentInfo,
                notes: student.notes,
                month: normalizedMonth,
                isFuturePayment,
                isFamilyPayment: cluster.length > 1,
                familyMembers: familyMembersInfo,
                familyClusterKey: getFamilyClusterKey(student.token, allStudentsMap),
                accountNameVerified: autoAccountNameVerified,
                accountNumVerified: autoAccountNumVerified,
                timestamp: new Date().toLocaleString(),
                isAudited: false
            };
        };

        const App = () => {
            const [config, setConfig] = useState({
                gradeFees: { 1: 3500, 2: 3000, 3: 3000, 4: 3000, 5: 3000, 6: 3000, 7: 3000, 8: 3000, 9: 3000, 10: 3000, 11: 3000 },
                lateFee: 500,
                lateLogicStart: getTodayDDMMYYYY(),
                auditMonth: 'August 2026',
                depositAccountOwner: 'H G A M R Gamage',
                depositAccountNumber: '1020023476'
            });

            const [processedData, setProcessedData] = useState({
                studentMap: {},
                bankList: [],
                familyLinks: {},
                receipts: []
            });

            const [assetStatus, setAssetStatus] = useState({ master: false, bank: false, family: false, slips: false });

            const [results, setResults] = useState([]);
            const [isAuditing, setIsAuditing] = useState(false);
            const [status, setStatus] = useState("Ready for dataset upload");
            const [toast, setToast] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState(null);
            const [lastSaved, setLastSaved] = useState(null);

            const [activeFilter, setActiveFilter] = useState('all');
            const [gradeFilter, setGradeFilter] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedTokens, setSelectedTokens] = useState([]);

            const [intervention, setIntervention] = useState(null);
            const [isReviewMode, setIsReviewMode] = useState(false);
            const [modalNote, setModalNote] = useState('');
            const [scanningCardId, setScanningCardId] = useState(null);
            const [fullscreenSlip, setFullscreenSlip] = useState(null);
            const [zoomLevel, setZoomLevel] = useState(1);
            const [rotation, setRotation] = useState(0);

            const [imgContrast, setImgContrast] = useState(1.4);
            const [imgBrightness, setImgBrightness] = useState(0);
            const [imgThreshold, setImgThreshold] = useState(160);
            const [customPreviewUrl, setCustomPreviewUrl] = useState(null);
            const [isRescanning, setIsRescanning] = useState(false);

            const [standardComments, setStandardComments] = useState(DEFAULT_STANDARD_COMMENTS);
            const [showCommentEditor, setShowCommentEditor] = useState(false);
            const [newCommentInput, setNewCommentInput] = useState('');

            const [manualTraceSearch, setManualTraceSearch] = useState('');
            const [manualDescSearch, setManualDescSearch] = useState('');

            const [secondaryReportData, setSecondaryReportData] = useState([]);
            const [secondarySlips, setSecondarySlips] = useState([]);
            const [selectedSecondaryStudent, setSelectedSecondaryStudent] = useState(null);
            const [secondarySearchQuery, setSecondarySearchQuery] = useState('');
            const [secondaryCategoryFilter, setSecondaryCategoryFilter] = useState('all');
            const [secondaryStatus, setSecondaryStatus] = useState('Idle');

            const schedulerRef = useRef(null);
            const workerPoolRef = useRef([]);
            const poolSizeRef = useRef(Math.min(navigator.hardwareConcurrency || 4, 4));
            const cacheRef = useRef({});
            const captureAreaRef = useRef(null);
            const parentCardRef = useRef(null);
            const saveTimeoutRef = useRef(null);
            const bankIndexRef = useRef(new Map());

            const [ocrProgress, setOcrProgress] = useState({ isRunning: false, processed: 0, total: 0, text: '' });

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            const requestWakeLock = async () => {
                if ('wakeLock' in navigator) {
                    try { await navigator.wakeLock.request('screen'); } catch (e) {}
                }
            };

            useEffect(() => {
                loadFromDB();
                initEngine();
                requestWakeLock();
                return () => { terminatePool(); };
            }, []);

            useEffect(() => {
                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                saveTimeoutRef.current = setTimeout(() => saveToDB(), 1500); 
                return () => clearTimeout(saveTimeoutRef.current);
            }, [results, config, processedData, standardComments]);

            useEffect(() => {
                if (!intervention) {
                    setCustomPreviewUrl(null);
                    return;
                }
                const slip = processedData.receipts.find(r => r.id === intervention.id);
                if (slip && !isPdfFile(slip)) {
                    preprocessImage(slip.url, { contrast: imgContrast, brightness: imgBrightness, thresholdUpper: imgThreshold })
                        .then(url => setCustomPreviewUrl(url));
                }
            }, [intervention, imgContrast, imgBrightness, imgThreshold, processedData.receipts]);

            const terminatePool = async () => {
                if (schedulerRef.current) {
                    await schedulerRef.current.terminate();
                    schedulerRef.current = null;
                }
                workerPoolRef.current = [];
            };

            const initEngine = async () => {
                try {
                    await terminatePool();
                    const scheduler = Tesseract.createScheduler();
                    const poolCount = poolSizeRef.current;
                    for (let i = 0; i < poolCount; i++) {
                        const worker = await Tesseract.createWorker('eng');
                        scheduler.addWorker(worker);
                        workerPoolRef.current.push(worker);
                    }
                    schedulerRef.current = scheduler;
                    setStatus(`Tesseract Vision OCR Active (${poolCount} Multi-threaded Workers Ready)`);
                } catch (e) {
                    setStatus("OCR Engine Initialized in Standard Mode");
                }
            };

            const saveToDB = async () => {
                try {
                    const payload = {
                        config, results, standardComments,
                        data: { studentMap: processedData.studentMap, bankList: processedData.bankList, familyLinks: processedData.familyLinks },
                        status: { master: assetStatus.master, bank: assetStatus.bank, family: assetStatus.family, slips: false },
                        timestamp: new Date().getTime(),
                        ocrCache: cacheRef.current
                    };
                    if (window.idbKeyval) {
                        await idbKeyval.set(DB_KEY, payload);
                        setLastSaved(new Date());
                    }
                } catch (e) { console.error("Save Error", e); }
            };

            const loadFromDB = async () => {
                try {
                    if (!window.idbKeyval) return;
                    const saved = await idbKeyval.get(DB_KEY);
                    if (saved) {
                        setConfig(saved.config || config);
                        setResults(saved.results || []);
                        if (saved.standardComments && Array.isArray(saved.standardComments)) {
                            const merged = [...saved.standardComments];
                            DEFAULT_STANDARD_COMMENTS.forEach(sc => {
                                if (!merged.includes(sc)) merged.push(sc);
                            });
                            setStandardComments(merged);
                        }
                        setProcessedData(prev => ({
                            ...prev,
                            studentMap: saved.data?.studentMap || {},
                            bankList: saved.data?.bankList || [],
                            familyLinks: saved.data?.familyLinks || {}
                        }));
                        setAssetStatus(saved.status || assetStatus);
                        if (saved.ocrCache) cacheRef.current = saved.ocrCache;
                        setStatus(saved.results?.length > 0 ? "Session Restored from Storage" : "Ready for dataset upload");
                    }
                } catch (e) { console.error("Load Error", e); }
            };

            const handleAddStandardComment = () => {
                const trimmed = newCommentInput.trim();
                if (!trimmed) return;
                if (standardComments.some(c => c.toLowerCase() === trimmed.toLowerCase())) {
                    return showToast("This comment already exists in the list.", "error");
                }
                const updated = [...standardComments, trimmed];
                setStandardComments(updated);
                setNewCommentInput("");
                setModalNote(trimmed);
                showToast(`Added comment "${trimmed}" to preset list!`, "success");
            };

            const handleRemoveStandardComment = (commentToRemove) => {
                const updated = standardComments.filter(c => c !== commentToRemove);
                setStandardComments(updated);
                showToast("Comment tag removed", "info");
            };

            const resetSystem = () => {
                setConfirmDialog({
                    title: "Reset AuditCore Engine",
                    message: "Are you sure you want to clear all loaded datasets, cached OCR entries, receipts, and audit results?",
                    onConfirm: async () => {
                        if (window.idbKeyval) await idbKeyval.del(DB_KEY);
                        setProcessedData({ studentMap: {}, bankList: [], familyLinks: {}, receipts: [] });
                        setAssetStatus({ master: false, bank: false, family: false, slips: false });
                        setResults([]);
                        setIntervention(null);
                        setSecondaryReportData([]);
                        setSecondarySlips([]);
                        setStatus("System Reset Completed");
                        showToast("System reset completed. All records cleared.", "info");
                    }
                });
            };

            const runSmartAudit = async () => {
                const students = Object.values(processedData.studentMap);
                if (students.length === 0) {
                    showToast("Please upload Master Student CSV data first!", "error");
                    return;
                }

                setIsAuditing(true);
                setStatus("Indexing Bank Transactions...");

                const { studentMap, bankList, familyLinks } = processedData;
                const bankTokenMap = new Map(); 
                const knownStudentTokens = new Set(Object.keys(studentMap));

                const extractVBATokens = (str) => {
                    if (!str) return [];
                    const matches = str.match(/\b\d{1,6}\b/g) || [];
                    const exclusions = ['2022', '2023', '2024', '2025', '2026', '2027', '2028', '2029', '2030'];
                    return matches.filter(m => {
                        if (exclusions.includes(m)) return false;
                        if (m.length <= 2) return knownStudentTokens.has(m);
                        return true;
                    });
                };

                bankList.forEach(txn => {
                    const tokens = extractVBATokens(txn.desc);
                    tokens.forEach(t => {
                        if (!bankTokenMap.has(t)) bankTokenMap.set(t, []);
                        bankTokenMap.get(t).push(txn);
                    });
                });
                bankIndexRef.current = bankTokenMap;

                setStatus("Executing Strict Audit Engine with Family Alignment...");

                try {
                    const compiledResults = students.map(student => {
                        const cluster = familyLinks[student.token] || [student.token];
                        const slip = processedData.receipts.find(r => r.id === student.token);
                        const cacheKey = slip ? `${config.auditMonth}_${slip.name}` : null;
                        const cachedOcr = cacheKey ? cacheRef.current[cacheKey] : null;

                        return analyzeStudent(
                            student, 
                            cluster, 
                            bankTokenMap, 
                            config, 
                            bankList, 
                            studentMap,
                            cachedOcr
                        );
                    });

                    const familySortedResults = compiledResults.sort((a, b) => {
                        if (a.familyClusterKey !== b.familyClusterKey) {
                            return a.familyClusterKey.localeCompare(b.familyClusterKey, undefined, { numeric: true });
                        }
                        return a.id.toString().localeCompare(b.id.toString(), undefined, { numeric: true });
                    });

                    setResults(familySortedResults);
                    setStatus(`Audit Complete: ${familySortedResults.length} records processed.`);
                    showToast(`Smart Audit executed! Processed ${familySortedResults.length} records.`, "success");
                } catch (err) {
                    console.error("Audit error:", err);
                    showToast(`Audit failed: ${err.message}`, "error");
                } finally {
                    setIsAuditing(false);
                }
            };

            const scanSingleCardOcr = async (studentId) => {
                const slip = processedData.receipts.find(r => r.id === studentId);
                if (!slip) return showToast(`No slip image found for student #${studentId}`, "error");

                setScanningCardId(studentId);
                try {
                    if (!schedulerRef.current) await initEngine();
                    let imageToScan = slip.url;
                    if (isPdfFile(slip)) {
                        const pdf = await pdfjsLib.getDocument(slip.url).promise;
                        const page = await pdf.getPage(1);
                        const viewport = page.getViewport({ scale: 2.0 });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        await page.render({ canvasContext: context, viewport: viewport }).promise;
                        imageToScan = canvas.toDataURL('image/jpeg');
                    }

                    const processedImg = await preprocessImage(imageToScan);
                    const ret = await schedulerRef.current.addJob('recognize', processedImg);
                    const text = ret.data.text;
                    const slipData = extractSlipData(text, config);

                    const cacheKey = `${config.auditMonth}_${slip.name}`;
                    cacheRef.current[cacheKey] = { text, ...slipData };

                    const student = processedData.studentMap[studentId];
                    const cluster = processedData.familyLinks[studentId] || [studentId];
                    const updatedRes = analyzeStudent(student, cluster, bankIndexRef.current, config, processedData.bankList, processedData.studentMap, { text, ...slipData });

                    setResults(prev => prev.map(r => r.id === studentId ? updatedRes : r));
                    if (intervention && intervention.id === studentId) {
                        setIntervention(updatedRes);
                    }
                    showToast(`OCR Scan complete for #${studentId}. TRACE: ${slipData.trace || 'None found'}`, "success");
                } catch (e) {
                    showToast(`OCR Scan error: ${e.message}`, "error");
                } finally {
                    setScanningCardId(null);
                }
            };

            const rescanModalImageWithAdjuster = async () => {
                if (!intervention) return;
                const slip = processedData.receipts.find(r => r.id === intervention.id);
                if (!slip || isPdfFile(slip)) return showToast("Image adjustment is applicable to JPG/PNG images only.", "info");

                setIsRescanning(true);
                try {
                    if (!schedulerRef.current) await initEngine();
                    const tweakedImgDataUrl = await preprocessImage(slip.url, {
                        contrast: imgContrast,
                        brightness: imgBrightness,
                        thresholdUpper: imgThreshold
                    });
                    
                    setCustomPreviewUrl(tweakedImgDataUrl);

                    const ret = await schedulerRef.current.addJob('recognize', tweakedImgDataUrl);
                    const text = ret.data.text;
                    const slipData = extractSlipData(text, config);

                    const cacheKey = `${config.auditMonth}_${slip.name}`;
                    cacheRef.current[cacheKey] = { text, ...slipData };

                    const student = processedData.studentMap[intervention.id];
                    const cluster = processedData.familyLinks[intervention.id] || [intervention.id];
                    const updatedRes = analyzeStudent(student, cluster, bankIndexRef.current, config, processedData.bankList, processedData.studentMap, { text, ...slipData });

                    setIntervention(updatedRes);
                    setResults(prev => prev.map(r => r.id === intervention.id ? updatedRes : r));
                    showToast(`Custom Image Rescan Complete! TRACE: ${slipData.trace || 'None'}`, "success");
                } catch (e) {
                    showToast(`Rescan error: ${e.message}`, "error");
                } finally {
                    setIsRescanning(false);
                }
            };

            const openReview = (res) => { 
                if (intervention && isReviewMode && intervention.id !== res.id) {
                    const isNegativeOrRejection = /reject|invalid|wrong|not available|waived|excused/i.test(modalNote);
                    if (!isNegativeOrRejection && (!intervention.accountNameVerified || !intervention.accountNumVerified)) {
                        showToast("VERIFICATION LOCKED: Complete verification (tick Name & Acc#) before switching!", "error");
                        return;
                    }
                }

                setIntervention(res); 
                setModalNote(res.forensicNote || ""); 
                setIsReviewMode(true);
                setImgContrast(1.4);
                setImgBrightness(0);
                setImgThreshold(160);
                setManualTraceSearch('');
                setManualDescSearch('');
                setShowCommentEditor(false);
            };

            const saveReviewAndNext = () => {
                if (!intervention) return;

                const isNegativeOrRejection = /reject|invalid|wrong|not available|waived|excused/i.test(modalNote);
                if (!isNegativeOrRejection) {
                    if (!intervention.accountNameVerified || !intervention.accountNumVerified) {
                        showToast("VERIFICATION LOCKED: Tick BOTH 'Receiver Name' and 'Account Number' before confirming!", "error");
                        return;
                    }
                }

                const updatedResults = results.map(r => r.id === intervention.id ? { 
                    ...r, 
                    forensicNote: modalNote, 
                    accountNameVerified: !!intervention.accountNameVerified, 
                    accountNumVerified: !!intervention.accountNumVerified, 
                    isAudited: true 
                } : r);

                setResults(updatedResults);

                const currentIdx = filteredResults.findIndex(r => r.id === intervention.id);
                let nextItem = null;
                if (currentIdx !== -1) {
                    nextItem = filteredResults.slice(currentIdx + 1).find(r => !r.isAudited) || filteredResults[currentIdx + 1];
                }

                if (nextItem) {
                    const updatedNext = updatedResults.find(r => r.id === nextItem.id) || nextItem;
                    setIntervention(updatedNext);
                    setModalNote(updatedNext.forensicNote || "");
                    setManualTraceSearch('');
                    setManualDescSearch('');
                } else {
                    setIntervention(null);
                    setIsReviewMode(false);
                    setStatus("Manual Audit complete for this view!");
                    showToast("Manual Audit complete for current view!", "success");
                }
            };

            const navigateReview = (direction) => {
                if (!intervention) return;
                const currentIdx = filteredResults.findIndex(r => r.id === intervention.id);
                const targetIdx = currentIdx + direction;
                if (targetIdx >= 0 && targetIdx < filteredResults.length) {
                    const target = filteredResults[targetIdx];
                    openReview(target);
                }
            };

            const closeReview = () => { setIntervention(null); setIsReviewMode(false); };

            const continueManualAudit = () => {
                if (results.length === 0) return showToast("Please load datasets and run the audit first.", "error");
                const nextUnaudited = results.find(r => !r.isAudited);
                if (nextUnaudited) {
                    openReview(nextUnaudited);
                } else {
                    showToast("All entries have already been manually audited!", "info");
                    openReview(results[0]);
                }
            };

            const attachManualBankTxn = (bankTxn) => {
                if (!intervention) return;
                const existingMatches = intervention.matches || [];
                const alreadyLinked = existingMatches.some(m => m.id === bankTxn.id);
                const newMatches = alreadyLinked ? existingMatches : [...existingMatches, { ...bankTxn, method: 'Manual Search Link', confidence: 100 }];
                
                const newPaid = newMatches.reduce((sum, t) => sum + t.amount, 0);
                const isExact = Math.abs(newPaid - intervention.expected) < 1.0;
                
                let newNote = intervention.forensicNote;
                let newStatus = intervention.statusType;

                if (isExact) {
                    newStatus = 'confirmed';
                    newNote = `VERIFIED: Deposit Confirmed via Manual Bank Link (Rs. ${newPaid})`;
                } else if (newMatches.length > 0) {
                    newStatus = 'odd';
                    newNote = `FLAGGED: Partial Amount (Paid Rs. ${newPaid} vs Expected Rs. ${intervention.expected})`;
                } else {
                    newStatus = 'unmatched';
                    newNote = 'FLAGGED: No corresponding bank deposit found for Token ID';
                }

                const updatedIntervention = {
                    ...intervention,
                    matches: newMatches,
                    paid: newPaid,
                    statusType: newStatus,
                    forensicNote: newNote
                };

                setIntervention(updatedIntervention);
                setModalNote(newNote);
                setResults(prev => prev.map(r => r.id === intervention.id ? updatedIntervention : r));
                showToast(`Bank transaction Rs.${bankTxn.amount} attached to student #${intervention.id}!`, "success");
            };

            const detachBankTxn = (bankTxnId) => {
                if (!intervention) return;
                const existingMatches = intervention.matches || [];
                const newMatches = existingMatches.filter(m => m.id !== bankTxnId);
                
                const newPaid = newMatches.reduce((sum, t) => sum + t.amount, 0);
                const isExact = Math.abs(newPaid - intervention.expected) < 1.0;
                
                let newNote = '';
                let newStatus = 'unmatched';

                if (newMatches.length > 0) {
                    if (isExact) {
                        newStatus = 'confirmed';
                        newNote = `VERIFIED: Full Payment Confirmed (Rs. ${newPaid})`;
                    } else {
                        newStatus = 'odd';
                        newNote = `FLAGGED: Partial Amount (Paid Rs. ${newPaid} vs Expected Rs. ${intervention.expected})`;
                    }
                } else {
                    newStatus = 'unmatched';
                    newNote = 'FLAGGED: No corresponding bank deposit found for Token ID';
                }

                const updatedIntervention = {
                    ...intervention,
                    matches: newMatches,
                    paid: newPaid,
                    statusType: newStatus,
                    forensicNote: newNote
                };

                setIntervention(updatedIntervention);
                setModalNote(newNote);
                setResults(prev => prev.map(r => r.id === intervention.id ? updatedIntervention : r));
                showToast(`Bank credit entry removed from student #${intervention.id}`, "info");
            };

            const manualSearchResultTxns = useMemo(() => {
                if (!manualTraceSearch && !manualDescSearch) return [];
                const traceQ = manualTraceSearch.trim();
                const descQ = manualDescSearch.trim().toUpperCase();

                return processedData.bankList.filter(txn => {
                    const matchTrace = traceQ ? new RegExp(`\\b${traceQ}\\b`, 'i').test(txn.desc) || txn.desc.includes(traceQ) : true;
                    const matchDesc = descQ ? txn.desc.toUpperCase().includes(descQ) : true;
                    return matchTrace && matchDesc;
                }).slice(0, 5);
            }, [manualTraceSearch, manualDescSearch, processedData.bankList]);

            const toggleSelectAll = () => {
                if (selectedTokens.length === filteredResults.length) {
                    setSelectedTokens([]);
                } else {
                    setSelectedTokens(filteredResults.map(r => r.id));
                }
            };

            const toggleSelectToken = (id) => {
                setSelectedTokens(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
            };

            const batchSetStatus = (statusLabel) => {
                if (selectedTokens.length === 0) return showToast("Select items first using checkboxes.", "error");
                setResults(prev => prev.map(r => selectedTokens.includes(r.id) ? { ...r, forensicNote: statusLabel, isAudited: true } : r));
                setSelectedTokens([]);
                showToast(`Batch updated ${selectedTokens.length} records!`, "success");
            };

            const processFileList = async (files) => {
                if (!files || files.length === 0) return;
                setStatus("Reading & Classifying Files...");

                let newReceipts = [];
                let newBank = [...processedData.bankList];
                let newMaster = { ...processedData.studentMap };
                let familyLinksObj = { ...processedData.familyLinks };
                if (Array.isArray(familyLinksObj)) familyLinksObj = {}; 

                let found = { ...assetStatus };

                for (const file of files) {
                    const name = file.name.toLowerCase();
                    const isSlip = name.endsWith('.jpg') || name.endsWith('.png') || name.endsWith('.pdf') || name.endsWith('.jpeg');
                    const isSpreadsheet = name.endsWith('.csv') || name.endsWith('.xlsx') || name.endsWith('.xls');

                    if (isSpreadsheet || name.includes('master') || name.includes('bank') || name.includes('family')) {
                        try {
                            const buffer = await file.arrayBuffer();
                            const wb = XLSX.read(new Uint8Array(buffer), { type: 'array', cellDates: true });
                            const sheetName = wb.SheetNames[0];
                            const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: false, defval: "" });

                            if (rows.length === 0) continue;

                            let headerRowIdx = rows.findIndex(r => r.some(c => c && /\b(student name|name|student id|token|transaction date|credit|family id)\b/i.test(c.toString())));
                            if (headerRowIdx === -1) headerRowIdx = 0;

                            const headers = (rows[headerRowIdx] || []).map(h => (h || "").toString().toLowerCase().trim());
                            const dataRows = rows.slice(headerRowIdx + 1);

                            const isMasterCSV = name.includes('master') || headers.some(h => h.includes('student name') || h.includes('student id') || h === 'token' || h.endsWith('token'));
                            const isBankCSV = name.includes('bank') || headers.some(h => h.includes('transaction date') || h.includes('credit') || h.includes('debit') || h.includes('particular'));
                            const isFamilyCSV = name.includes('family') || headers.some(h => h.includes('family id') || h.includes('member ids') || h.includes('cluster'));

                            if (isMasterCSV) {
                                const idIdx = headers.findIndex(h => /\b(id|token)\b/i.test(h)) !== -1 ? headers.findIndex(h => /\b(id|token)\b/i.test(h)) : 2;
                                const nameIdx = headers.findIndex(h => h.includes('name')) !== -1 ? headers.findIndex(h => h.includes('name')) : 3;
                                const gradeIdx = headers.findIndex(h => h.includes('grade')) !== -1 ? headers.findIndex(h => h.includes('grade')) : 1;
                                const dateIdx = headers.findIndex(h => h.includes('timestamp') || h.includes('date')) !== -1 ? headers.findIndex(h => h.includes('timestamp') || h.includes('date')) : 0;
                                const monthIdx = headers.findIndex(h => h.includes('month')) !== -1 ? headers.findIndex(h => h.includes('month')) : 4;
                                const infoIdx = headers.findIndex(h => h.includes('payment') || h.includes('info')) !== -1 ? headers.findIndex(h => h.includes('payment') || h.includes('info')) : 5;
                                const linkIdx = headers.findIndex(h => h.includes('link') || h.includes('url')) !== -1 ? headers.findIndex(h => h.includes('link') || h.includes('url')) : 6;
                                const notesIdx = headers.findIndex(h => h.includes('note')) !== -1 ? headers.findIndex(h => h.includes('note')) : 7;

                                dataRows.forEach(r => {
                                    const id = (r[idIdx] || "").toString().trim();
                                    const timestamp = parseDate(r[dateIdx]);
                                    if (id) {
                                        newMaster[id] = {
                                            uploadTimestamp: timestamp,
                                            grade: r[gradeIdx] || 'Grade 1',
                                            token: id,
                                            name: r[nameIdx] || 'Unknown Student',
                                            month: r[monthIdx] || '',
                                            paymentInfo: r[infoIdx] || '',
                                            link: r[linkIdx] || '',
                                            notes: r[notesIdx] || ''
                                        };
                                    }
                                });
                                found.master = true;
                            } else if (isBankCSV) {
                                const dateIdx = headers.findIndex(h => h.includes('date')) !== -1 ? headers.findIndex(h => h.includes('date')) : 0;
                                const descIdx = headers.findIndex(h => h.includes('desc') || h.includes('particular') || h.includes('detail') || h.includes('narration')) !== -1 ? headers.findIndex(h => h.includes('desc') || h.includes('particular') || h.includes('detail') || h.includes('narration')) : 2;
                                const creditIdx = headers.findIndex(h => h.includes('credit') || h.includes('deposit') || h.includes('amount')) !== -1 ? headers.findIndex(h => h.includes('credit') || h.includes('deposit') || h.includes('amount')) : 5;

                                dataRows.forEach((r, idx) => {
                                    const rawVal = (r[creditIdx] !== undefined ? r[creditIdx] : (r[5] || r[7] || "0")).toString().replace(/,/g, '');
                                    const credit = parseFloat(rawVal);
                                    const desc = normalize(r[descIdx] !== undefined ? r[descIdx] : r[2]);
                                    const txnDate = parseDate(r[dateIdx] !== undefined ? r[dateIdx] : r[0]);

                                    if (!isNaN(credit) && credit > 0) {
                                        newBank.push({
                                            id: `TXN-${idx}-${Date.now()}`,
                                            date: txnDate,
                                            desc: desc,
                                            amount: credit,
                                            raw: r
                                        });
                                    }
                                });
                                found.bank = true;
                            } else if (isFamilyCSV) {
                                dataRows.forEach(r => {
                                    const rowString = r.join(' ');
                                    const cluster = (rowString.match(/\b\d{2,6}\b/g) || []).map(s => s.trim());
                                    if (cluster.length > 1) {
                                        const uniqueCluster = [...new Set(cluster)];
                                        uniqueCluster.forEach(mid => familyLinksObj[mid] = uniqueCluster);
                                    }
                                });
                                found.family = true;
                            }
                        } catch (err) {
                            console.error(`Error parsing file ${file.name}:`, err);
                        }
                    } else if (isSlip) {
                        const idFromSlip = extractIdFromSlip(file);
                        newReceipts.push({ file, id: idFromSlip, name: file.name, url: URL.createObjectURL(file), type: file.type || '' });
                        found.slips = true;
                    }
                }

                setProcessedData({
                    studentMap: newMaster,
                    bankList: newBank,
                    familyLinks: familyLinksObj,
                    receipts: [...processedData.receipts, ...newReceipts]
                });
                setAssetStatus(found);
                setStatus(`Loaded: ${Object.keys(newMaster).length} Students, ${newBank.length} Bank TXNs`);
                showToast(`Assets Loaded: ${Object.keys(newMaster).length} Students, ${newBank.length} Bank Credits.`, "info");
            };

            const handleFiles = (e) => {
                processFileList(Array.from(e.target.files || []));
            };

            const handleDrop = (e) => {
                e.preventDefault(); e.stopPropagation();
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    processFileList(Array.from(e.dataTransfer.files));
                }
            };

            const handleDragOver = (e) => { e.preventDefault(); e.stopPropagation(); };

            const handleSecondaryFiles = async (e) => {
                const files = Array.from(e.target.files || []);
                if (files.length === 0) return;

                setSecondaryStatus('Processing secondary audit files...');
                let parsedFindings = [];
                let parsedSlips = [...secondarySlips];

                for (const file of files) {
                    const name = file.name.toLowerCase();
                    if (name.endsWith('.xlsx') || name.endsWith('.xls') || name.endsWith('.csv')) {
                        try {
                            const buffer = await file.arrayBuffer();
                            const wb = XLSX.read(new Uint8Array(buffer), { type: 'array' });
                            
                            wb.SheetNames.forEach(sheetName => {
                                const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: false, defval: "" });
                                if (rows.length > 1) {
                                    const headers = rows[0].map(h => (h || "").toString().toLowerCase().trim());
                                    const tokenIdx = headers.findIndex(h => h.includes('token') || h.includes('id'));
                                    const nameIdx = headers.findIndex(h => h.includes('student name') || h.includes('name'));
                                    const gradeIdx = headers.findIndex(h => h.includes('grade'));
                                    const paidIdx = headers.findIndex(h => h.includes('amount paid') || h.includes('paid'));
                                    const baseFeeIdx = headers.findIndex(h => h.includes('base fee'));
                                    const lateFeeIdx = headers.findIndex(h => h.includes('late fee'));
                                    const expectedIdx = headers.findIndex(h => h.includes('total expected') || h.includes('expected'));
                                    const commentIdx = headers.findIndex(h => h.includes('comment') || h.includes('remark') || h.includes('note'));

                                    rows.slice(1).forEach((r, i) => {
                                        const token = (r[tokenIdx >= 0 ? tokenIdx : 0] || '').toString().trim();
                                        const studentName = r[nameIdx >= 0 ? nameIdx : 1];
                                        if (token || studentName) {
                                            const paid = r[paidIdx >= 0 ? paidIdx : 4] || '0';
                                            const totalExpected = r[expectedIdx >= 0 ? expectedIdx : 7] || '0';
                                            const baseFee = baseFeeIdx >= 0 && r[baseFeeIdx] !== "" ? r[baseFeeIdx] : (Number(totalExpected) > 500 ? Number(totalExpected) - 500 : totalExpected);
                                            const lateFee = lateFeeIdx >= 0 && r[lateFeeIdx] !== "" ? r[lateFeeIdx] : (Number(totalExpected) > Number(baseFee) ? Number(totalExpected) - Number(baseFee) : 0);

                                            parsedFindings.push({
                                                id: `SEC-${sheetName}-${i}`,
                                                token: token || 'N/A',
                                                name: studentName || 'Student',
                                                grade: r[gradeIdx >= 0 ? gradeIdx : 2] || 'Grade 1',
                                                paid: paid,
                                                baseFee: baseFee,
                                                lateFee: lateFee,
                                                totalExpected: totalExpected,
                                                comment: r[commentIdx >= 0 ? commentIdx : 12] || 'Audited Record',
                                                sheetCategory: sheetName
                                            });
                                        }
                                    });
                                }
                            });
                        } catch (err) { console.error("Secondary Report Error:", err); }
                    } else if (name.endsWith('.jpg') || name.endsWith('.png') || name.endsWith('.jpeg') || name.endsWith('.pdf')) {
                        const idFromSlip = extractIdFromSlip(file);
                        parsedSlips.push({ id: idFromSlip, name: file.name, url: URL.createObjectURL(file), type: file.type || '' });
                    }
                }

                setSecondaryReportData(parsedFindings);
                setSecondarySlips(parsedSlips);
                if (parsedFindings.length > 0) setSelectedSecondaryStudent(parsedFindings[0]);
                setSecondaryStatus(`Secondary Workflow Ready (${parsedFindings.length} Records Loaded)`);
                showToast(`Secondary Report Loaded: ${parsedFindings.length} records parsed!`, "success");
            };

            const secondaryCategories = useMemo(() => {
                const cats = new Set(secondaryReportData.map(d => d.sheetCategory));
                return ['all', ...Array.from(cats)];
            }, [secondaryReportData]);

            const filteredSecondaryReport = useMemo(() => {
                return secondaryReportData.filter(item => {
                    const matchCat = secondaryCategoryFilter === 'all' || item.sheetCategory === secondaryCategoryFilter;
                    const q = secondarySearchQuery.toLowerCase();
                    const matchSearch = !q || item.name.toLowerCase().includes(q) || item.token.toString().includes(q);
                    return matchCat && matchSearch;
                });
            }, [secondaryReportData, secondaryCategoryFilter, secondarySearchQuery]);

            const selectedSecondarySlip = useMemo(() => {
                if (!selectedSecondaryStudent) return null;
                const matchToken = selectedSecondaryStudent.token.toString().trim();
                return secondarySlips.find(s => s.id === matchToken) || 
                       processedData.receipts.find(s => s.id === matchToken) || 
                       secondarySlips[0] || null;
            }, [selectedSecondaryStudent, secondarySlips, processedData.receipts]);

            const downloadParentCard = async () => {
                if (!parentCardRef.current) return;
                try {
                    showToast("Generating Parent Advisory Notice Image...", "info");
                    const canvas = await html2canvas(parentCardRef.current, { scale: 2, backgroundColor: '#0b0f19', useCORS: true, allowTaint: true, logging: false });
                    const link = document.createElement('a');
                    link.download = `Official_Audit_Notice_${selectedSecondaryStudent?.token}_${(selectedSecondaryStudent?.name || 'Student').replace(/\s+/g, '_')}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast("Parent Advisory Notice saved as PNG!", "success");
                } catch (e) { showToast(`Export failed: ${e.message}`, "error"); }
            };

            const getCleanMonthNameForFile = () => {
                const pDate = parseDate(config.lateLogicStart);
                if (pDate && !isNaN(pDate.getTime())) {
                    const monthNames = [
                        'January', 'February', 'March', 'April', 'May', 'June',
                        'July', 'August', 'September', 'October', 'November', 'December'
                    ];
                    return `${monthNames[pDate.getMonth()]}_${pDate.getFullYear()}`;
                }

                if (config.auditMonth) {
                    const cleanMonth = config.auditMonth.trim().replace(/[^A-Za-z0-9_\-]/g, '_').replace(/_+/g, '_');
                    if (cleanMonth) return cleanMonth;
                }

                const now = new Date();
                const defaultMonths = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
                return `${defaultMonths[now.getMonth()]}_${now.getFullYear()}`;
            };

            const exportReport = () => {
                if (results.length === 0) return showToast("No audit results to export. Run audit first.", "error");

                const mapRecordToExportRow = (r) => ({
                    'Token ID': r.id,
                    'Student Name': r.folder,
                    'Grade': r.grade || '-',
                    'Status': r.statusType.toUpperCase(),
                    'Amount Paid (LKR)': r.paid,
                    'Base Fee Expected (LKR)': r.baseExpected,
                    'Late Fee Required (LKR)': r.lateFeeAmount,
                    'Total Expected (LKR)': r.expected,
                    'Late Submission': r.isLateSubmission ? 'YES' : 'NO',
                    'OneDrive / Slip Link': r.link || '-',
                    'OCR Trace Read': r.ocrTrace || '-',
                    'Payment / Upload Date': r.effDate ? r.effDate.toLocaleDateString() : '-',
                    'Matched Bank Description': r.matches && r.matches.length > 0 ? r.matches.map(m => m.desc).join(' | ') : 'N/A',
                    'Matched Bank Amount': r.matches && r.matches.length > 0 ? r.matches.map(m => `Rs.${m.amount}`).join(' | ') : '0',
                    'Auditor Comment': r.forensicNote || ''
                });

                const wb = XLSX.utils.book_new();

                // 1. Add Master Ledger Tab
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(results.map(mapRecordToExportRow)), "Master Ledger");

                // 2. Group all records dynamically by Auditor Comment (forensicNote)
                const commentGroups = {};
                results.forEach(r => {
                    const commentKey = (r.forensicNote || '').trim() || 'No Comment';
                    if (!commentGroups[commentKey]) {
                        commentGroups[commentKey] = [];
                    }
                    commentGroups[commentKey].push(r);
                });

                // 3. Append a tab for each distinct comment
                Object.entries(commentGroups).forEach(([commentText, records]) => {
                    // Sanitize Excel sheet name (max 31 chars, forbidden chars: \ / ? * : [ ])
                    let cleanTabName = commentText.replace(/[:\\/?*\[\]]/g, '').substring(0, 30).trim() || 'Category';
                    let uniqueTabName = cleanTabName;
                    let counter = 1;
                    while (wb.SheetNames.includes(uniqueTabName)) {
                        uniqueTabName = `${cleanTabName.substring(0, 26)} (${counter++})`;
                    }
                    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(records.map(mapRecordToExportRow)), uniqueTabName);
                });

                const outputFileName = `AuditCore_Report_${getCleanMonthNameForFile()}.xlsx`;
                XLSX.writeFile(wb, outputFileName);
                showToast(`Multi-tab Excel report exported by comment tabs as ${outputFileName}!`, "success");
            };

            const exportLateFeeReport = () => {
                const lateFeeMissingList = results.filter(r => r.statusType === 'late_fee_missing');
                if (lateFeeMissingList.length === 0) return showToast("No missing late fee defaulters found.", "info");

                const data = lateFeeMissingList.map(r => ({
                    'Token ID': r.id,
                    'Student Name': r.folder,
                    'Grade': r.grade || '-',
                    'Upload / Payment Date': r.effDate ? r.effDate.toLocaleDateString() : '-',
                    'Amount Paid (LKR)': r.paid,
                    'Required Base Fee (LKR)': r.baseExpected,
                    'Missing Late Fee (LKR)': r.lateFeeAmount,
                    'OneDrive / Slip Link': r.link || '-',
                    'Auditor Comment': r.forensicNote
                }));
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(data), "Late Fee Defaulters");
                const outputFileName = `Late_Fee_Defaulters_${getCleanMonthNameForFile()}.xlsx`;
                XLSX.writeFile(wb, outputFileName);
                showToast(`Defaulters report generated as ${outputFileName}!`, "success");
            };

            const stats = useMemo(() => {
                const totalPaid = results.reduce((acc, r) => acc + (r.paid || 0), 0);
                const totalExpected = results.reduce((acc, r) => acc + (r.expected || 0), 0);
                const confirmedCount = results.filter(r => r.statusType === 'confirmed').length;
                const lateMissingCount = results.filter(r => r.statusType === 'late_fee_missing').length;
                const oddCount = results.filter(r => r.statusType === 'odd').length;
                const unmatchedCount = results.filter(r => r.statusType === 'unmatched').length;
                const totalCount = results.length || 1;
                const rate = Math.round((confirmedCount / totalCount) * 100);

                return { totalPaid, totalExpected, confirmedCount, lateMissingCount, oddCount, unmatchedCount, rate };
            }, [results]);

            const filteredResults = useMemo(() => {
                const baseFiltered = results.filter(r => {
                    const matchesFilter = activeFilter === 'all' || 
                        (activeFilter === 'future' ? r.isFuturePayment :
                        (activeFilter === 'unaudited' ? !r.isAudited :
                        r.statusType === activeFilter));
                    const matchesGrade = gradeFilter === 'all' || parseGradeNumber(r.grade).toString() === gradeFilter;
                    const q = searchQuery.toLowerCase();
                    const matchesSearch = !q || r.folder.toLowerCase().includes(q) || r.id.toString().includes(q) || (r.forensicNote && r.forensicNote.toLowerCase().includes(q));
                    return matchesFilter && matchesGrade && matchesSearch;
                });

                return baseFiltered.sort((a, b) => {
                    if (a.familyClusterKey !== b.familyClusterKey) {
                        return a.familyClusterKey.localeCompare(b.familyClusterKey, undefined, { numeric: true });
                    }
                    return a.id.toString().localeCompare(b.id.toString(), undefined, { numeric: true });
                });
            }, [results, activeFilter, gradeFilter, searchQuery]);

            const currentSlip = useMemo(() => intervention ? processedData.receipts.find(r => r.id === intervention.id) : null, [intervention, processedData.receipts]);
            const auditedCount = useMemo(() => results.filter(r => r.isAudited).length, [results]);

            return (
                <div className="min-h-screen p-4 md:p-8 flex flex-col gap-6 max-w-[1600px] mx-auto relative">
                    
                    {/* Toast Notification */}
                    {toast && (
                        <div className={`fixed bottom-6 right-6 z-[300] px-5 py-3 rounded-2xl shadow-2xl border flex items-center gap-3 animate-bounce ${
                            toast.type === 'error' ? 'bg-rose-950 border-rose-800 text-rose-200' :
                            toast.type === 'success' ? 'bg-emerald-950 border-emerald-800 text-emerald-200' :
                            'bg-indigo-950 border-indigo-800 text-indigo-200'
                        }`}>
                            <i className={`fas ${
                                toast.type === 'error' ? 'fa-exclamation-circle text-rose-400' :
                                toast.type === 'success' ? 'fa-check-circle text-emerald-400' :
                                'fa-info-circle text-indigo-400'
                            }`}></i>
                            <span className="text-xs font-bold">{toast.message}</span>
                        </div>
                    )}

                    {/* Confirmation Modal */}
                    {confirmDialog && (
                        <div className="fixed inset-0 z-[300] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-md w-full shadow-2xl space-y-4">
                                <h3 className="text-base font-extrabold text-white uppercase tracking-wider">{confirmDialog.title}</h3>
                                <p className="text-xs text-slate-300 leading-relaxed">{confirmDialog.message}</p>
                                <div className="flex gap-3 pt-2">
                                    <button onClick={() => setConfirmDialog(null)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-bold uppercase">Cancel</button>
                                    <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className="flex-1 bg-rose-600 hover:bg-rose-500 text-white py-2.5 rounded-xl text-xs font-bold uppercase shadow-lg shadow-rose-600/30">Confirm</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header className="glass-panel p-6 rounded-3xl flex flex-col lg:flex-row justify-between items-start lg:items-center relative overflow-hidden gap-4">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-500 via-indigo-500 to-amber-500"></div>
                        <div className="z-10">
                            <div className="flex items-center gap-2 text-indigo-400 font-mono text-xs tracking-widest uppercase mb-1">
                                <span className="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span>
                                Smart Audit Vision Engine v23.0
                            </div>
                            <h1 className="text-3xl md:text-4xl font-extrabold text-white tracking-tight flex items-center gap-3">
                                AuditCore<span className="text-indigo-500">Pro</span>
                                <span className="text-xs bg-indigo-500/20 text-indigo-300 font-mono border border-indigo-500/30 px-2.5 py-1 rounded-full uppercase">v23.0 Enterprise</span>
                            </h1>
                            <p className="text-slate-400 font-mono text-xs mt-1">{status}</p>
                        </div>

                        <div className="flex flex-wrap items-center gap-3 z-10">
                            {lastSaved && (
                                <div className="hidden sm:flex items-center gap-2 text-slate-400 font-mono text-[11px] bg-slate-900/80 px-3 py-1.5 rounded-full border border-slate-800">
                                    <i className="fas fa-check text-emerald-400"></i> Auto-saved {lastSaved.toLocaleTimeString()}
                                </div>
                            )}
                            <button onClick={continueManualAudit} className="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2.5 rounded-xl font-bold text-xs uppercase border border-amber-500/50 flex items-center gap-2 shadow-lg shadow-amber-600/20 transition-all">
                                <i className="fas fa-tasks text-amber-200"></i> Continue Manual Audit ({auditedCount}/{results.length})
                            </button>
                            <button onClick={resetSystem} className="bg-rose-950 hover:bg-rose-900 text-rose-300 px-3.5 py-2.5 rounded-xl font-bold text-xs uppercase border border-rose-800 flex items-center gap-2 transition-all">
                                <i className="fas fa-power-off text-rose-400"></i> Reset System
                            </button>
                            <button onClick={exportLateFeeReport} className="bg-rose-900/40 hover:bg-rose-900/80 text-rose-200 px-4 py-2.5 rounded-xl font-bold text-xs uppercase border border-rose-800/60 flex items-center gap-2">
                                <i className="fas fa-exclamation-circle text-rose-400"></i> Defaulters ({stats.lateMissingCount})
                            </button>
                            <button onClick={exportReport} className="bg-emerald-600 hover:bg-emerald-500 text-white border-emerald-500/50 shadow-lg shadow-emerald-600/20 px-4 py-2.5 rounded-xl font-bold text-xs uppercase border flex items-center gap-2 transition-all cursor-pointer">
                                <i className="fas fa-file-excel"></i> Export All Tabs
                            </button>
                            <button onClick={runSmartAudit} disabled={isAuditing} className="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-6 py-2.5 rounded-xl font-bold text-xs uppercase shadow-lg shadow-indigo-500/25 flex items-center gap-2 transition-all">
                                <i className={`fas ${isAuditing ? 'fa-spinner fa-spin' : 'fa-play'}`}></i>
                                {isAuditing ? 'Auditing...' : 'Run Audit'}
                            </button>
                        </div>
                    </header>

                    {/* Metric Cards Grid + Vision OCR Panel */}
                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4">
                        <div className="glass-panel p-4 rounded-2xl">
                            <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Reconciled Collections</span>
