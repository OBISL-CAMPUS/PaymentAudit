<body class="antialiased selection:bg-indigo-500 selection:text-white">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // --- STANDARD AUDIT COMMENTS ---
        const STANDARD_COMMENTS = [
            'Late Fees Not Paid',
            'Not Available in Bank Statement',
            'VERIFIED: Deposit Confirmed',
            'EXCUSED: Late Fee Waived',
            'FLAGGED: Partial Amount',
            'REJECTED: Invalid Receipt',
            'DUPLICATE: Double Submission'
        ];

        // --- FUZZY MATCHING & STRING UTILITIES ---

        const normalize = (str) => (str || "").toString().toUpperCase().trim().replace(/[^A-Z0-9\s]/g, ' ');

        const getTodayDDMMYYYY = () => {
            const today = new Date();
            const dd = String(today.getDate()).padStart(2, '0');
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const yyyy = today.getFullYear();
            return `${dd}/${mm}/${yyyy}`;
        };

        const formatDDMMYYYYtoYYYYMMDD = (str) => {
            if (!str) return '';
            const parts = str.split('/');
            if (parts.length === 3) {
                const [d, m, y] = parts;
                if (d && m && y && y.length === 4) {
                    return `${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`;
                }
            }
            return '';
        };

        const formatYYYYMMDDtoDDMMYYYY = (str) => {
            if (!str) return '';
            const parts = str.split('-');
            if (parts.length === 3) {
                const [y, m, d] = parts;
                return `${d.padStart(2, '0')}/${m.padStart(2, '0')}/${y}`;
            }
            return '';
        };

        const levenshteinDistance = (a, b) => {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = Array.from({ length: a.length + 1 }, () => Array(b.length + 1).fill(0));
            for (let i = 0; i <= a.length; i++) matrix[i][0] = i;
            for (let j = 0; j <= b.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= a.length; i++) {
                for (let j = 1; j <= b.length; j++) {
                    const cost = a[i - 1] === b[j - 1] ? 0 : 1;
                    matrix[i][j] = Math.min(
                        matrix[i - 1][j] + 1,
                        matrix[i][j - 1] + 1,
                        matrix[i - 1][j - 1] + cost
                    );
                }
            }
            return matrix[a.length][b.length];
        };

        const fuzzyNameSimilarity = (name, text) => {
            if (!name || !text || name.length < 3) return 0;
            const cleanName = normalize(name);
            const cleanText = normalize(text);

            if (cleanText.includes(cleanName)) return 100;

            const nameTokens = cleanName.split(/\s+/).filter(t => t.length > 2);
            if (nameTokens.length === 0) return 0;

            let matchedTokens = 0;
            const textTokens = cleanText.split(/\s+/);

            for (const nToken of nameTokens) {
                let bestMatch = false;
                for (const tToken of textTokens) {
                    if (tToken === nToken) { bestMatch = true; break; }
                    if (nToken.length > 3 && tToken.length > 3) {
                        const dist = levenshteinDistance(nToken, tToken);
                        if (dist <= 1) { bestMatch = true; break; }
                    }
                }
                if (bestMatch) matchedTokens++;
            }

            return Math.round((matchedTokens / nameTokens.length) * 100);
        };

        const parseDate = (val) => {
            if (!val) return null;
            if (val instanceof Date) return isNaN(val.getTime()) ? null : val;
            if (typeof val === 'number') return new Date(Math.round((val - 25569) * 86400 * 1000));
            const cleanStr = val.toString().trim();
            const parts = cleanStr.split(/[/\s.-]/);
            if (parts.length >= 3) {
                let d = parseInt(parts[0], 10), m = parseInt(parts[1], 10) - 1, y = parseInt(parts[2], 10);
                if (y < 100) y += 2000;
                const dObj = new Date(y, m, d);
                return isNaN(dObj.getTime()) ? null : dObj;
            }
            const direct = new Date(cleanStr);
            return isNaN(direct.getTime()) ? null : direct;
        };

        const preprocessImage = (imageSource, customParams = {}) => {
            return new Promise((resolve) => {
                const img = new Image();
                img.crossOrigin = 'Anonymous';
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = img.width;
                    canvas.height = img.height;
                    ctx.drawImage(img, 0, 0);

                    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const data = imgData.data;

                    let contrast = customParams.contrast !== undefined ? customParams.contrast : 1.4; 
                    let brightness = customParams.brightness !== undefined ? customParams.brightness : 0;
                    let thresholdUpper = customParams.thresholdUpper !== undefined ? customParams.thresholdUpper : 160;
                    let thresholdLower = customParams.thresholdLower !== undefined ? customParams.thresholdLower : 85;

                    let factor = (259 * (contrast * 100 + 255)) / (255 * (259 - contrast * 100));

                    for (let i = 0; i < data.length; i += 4) {
                        let avg = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                        avg = avg + brightness;
                        let color = factor * (avg - 128) + 128;
                        color = color > thresholdUpper ? 255 : (color < thresholdLower ? 0 : color); 
                        data[i] = color;
                        data[i + 1] = color;
                        data[i + 2] = color;
                    }
                    ctx.putImageData(imgData, 0, 0);
                    resolve(canvas.toDataURL('image/jpeg'));
                };
                img.onerror = () => resolve(imageSource);
                img.src = imageSource;
            });
        };

        const extractSlipData = (text) => {
            if (!text) return { amount: null, trace: null, potentialRefs: [], detectedDate: null };

            const cleanedText = text.replace(/([0-9])O([0-9])/gi, '$10$2')
                                   .replace(/([0-9])l([0-9])/gi, '$11$2');

            const amountRegex = /(?:Rs\.?|LKR|TOTAL|AMT)?\s*([1-9][0-9]{1,3}(?:,[0-9]{3})*(?:\.[0-9]{2})?)\b/gi;
            const matches = [...cleanedText.matchAll(amountRegex)];
            const candidates = matches.map(m => parseFloat(m[1].replace(/,/g, ''))).filter(n => n >= 500 && n <= 250000);
            const amount = candidates.length > 0 ? Math.max(...candidates) : null;

            let trace = null;
            const traceMatch = cleanedText.match(/(?:TRACE|SEQ|TXN|REF|NO|FT)[\s:.-]*([A-Z0-9]{4,12})/i);
            if (traceMatch) trace = traceMatch[1];

            const potentialRefs = [];
            const refMatches = cleanedText.matchAll(/\b[A-Z0-9]{6,20}\b/g);
            for (const m of refMatches) {
                const val = m[0];
                if (/\d/.test(val) && /[A-Z]/.test(val) && !potentialRefs.includes(val)) {
                    potentialRefs.push(val);
                }
            }

            let detectedDate = null;
            const dateMatch = cleanedText.match(/(\d{1,2})[/\.-](\d{1,2})[/\.-](\d{2,4})/);
            if (dateMatch) {
                detectedDate = parseDate(`${dateMatch[1]}/${dateMatch[2]}/${dateMatch[3]}`);
            }

            return { amount, trace, potentialRefs, detectedDate };
        };

        const DB_KEY = 'audit_core_db_v23';

        const parseGradeNumber = (gradeStr) => {
            if (!gradeStr) return 1;
            const match = gradeStr.toString().match(/\d+/);
            return match ? parseInt(match[0], 10) : 1;
        };

        const App = () => {
            const [config, setConfig] = useState({
                gradeFees: { 1: 3500, 2: 3000, 3: 3000, 4: 3000, 5: 3000, 6: 3000, 7: 3000, 8: 3000, 9: 3000, 10: 3000, 11: 3000 },
                lateFee: 500,
                lateLogicStart: getTodayDDMMYYYY(),
                auditMonth: 'July 2026'
            });

            const [processedData, setProcessedData] = useState({ 
                studentMap: {}, 
                bankList: [], 
                familyLinks: {}, 
                receipts: [] 
            });
            const [assetStatus, setAssetStatus] = useState({ master: false, bank: false, family: false, slips: false });

            // UI State
            const [ocrProgress, setOcrProgress] = useState({ total: 0, processed: 0, text: "Idle", isRunning: false });
            const [results, setResults] = useState([]);
            const [isAuditing, setIsAuditing] = useState(false);
            const [status, setStatus] = useState("Initializing Engine...");
            const [intervention, setIntervention] = useState(null); 
            const [modalNote, setModalNote] = useState("");
            const [activeFilter, setActiveFilter] = useState('all');
            const [gradeFilter, setGradeFilter] = useState('all');
            const [searchQuery, setSearchQuery] = useState('');
            const [lastSaved, setLastSaved] = useState(null);
            const [isReviewMode, setIsReviewMode] = useState(false);
            const [selectedTokens, setSelectedTokens] = useState([]);

            const [fullscreenSlip, setFullscreenSlip] = useState(null);
            const [zoomLevel, setZoomLevel] = useState(1);
            const [rotation, setRotation] = useState(0);

            // --- SECONDARY AUDIT WORKFLOW STATE ---
            const [secondaryReportData, setSecondaryReportData] = useState([]);
            const [secondarySlips, setSecondarySlips] = useState([]);
            const [secondaryMasterMap, setSecondaryMasterMap] = useState({});
            const [secondaryFamilyMap, setSecondaryFamilyMap] = useState({});
            const [secondaryCategoryFilter, setSecondaryCategoryFilter] = useState('all');
            const [secondarySearchQuery, setSecondarySearchQuery] = useState('');
            const [selectedSecondaryStudent, setSelectedSecondaryStudent] = useState(null);
            const [secondaryStatus, setSecondaryStatus] = useState("Ready for Secondary Report & Slips Import");
            const parentCardRef = useRef(null);

            // Interactive Image Adjuster State for Inspection Modal
            const [imgContrast, setImgContrast] = useState(1.4);
            const [imgBrightness, setImgBrightness] = useState(0);
            const [imgThreshold, setImgThreshold] = useState(160);
            const [isRescanning, setIsRescanning] = useState(false);
            const [customPreviewUrl, setCustomPreviewUrl] = useState(null);

            // Custom Modal Dialog & Toast State
            const [toast, setToast] = useState(null);
            const [confirmDialog, setConfirmDialog] = useState(null);

            // Dynamic Worker Pool & Queue Refs
            const schedulerRef = useRef(null);
            const workerPoolRef = useRef([]);
            const poolSizeRef = useRef(Math.min(navigator.hardwareConcurrency || 4, 4));
            const captureAreaRef = useRef(null);
            const saveTimeoutRef = useRef(null);
            const processingRef = useRef(false);
            const queueRef = useRef([]);
            const cacheRef = useRef({});
            const skipCurrentRef = useRef(false);
            const bankIndexRef = useRef(new Map());

            const showToast = (message, type = 'info') => {
                setToast({ message, type });
                setTimeout(() => setToast(null), 4000);
            };

            useEffect(() => {
                loadFromDB();
                initEngine();
                requestWakeLock();
                return () => { terminatePool(); };
            }, []);

            const requestWakeLock = async () => {
                if ('wakeLock' in navigator) {
                    try { await navigator.wakeLock.request('screen'); } catch (e) { console.log("Wake Lock unsupported"); }
                }
            };

            useEffect(() => {
                if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
                saveTimeoutRef.current = setTimeout(() => saveToDB(), 1500); 
                return () => clearTimeout(saveTimeoutRef.current);
            }, [results, config, processedData]);

            useEffect(() => {
                const handleKey = (e) => {
                    if (fullscreenSlip) {
                        if (e.key === 'Escape') setFullscreenSlip(null);
                        return;
                    }
                    if (intervention) {
                        if (e.key === 'Enter' && e.ctrlKey) isReviewMode ? saveReviewAndNext() : setIntervention(null);
                        if (e.key === 'Escape') isReviewMode ? closeReview() : setIntervention(null);
                    }
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [intervention, fullscreenSlip, isReviewMode, results]);

            useEffect(() => {
                if (!intervention) {
                    setCustomPreviewUrl(null);
                    return;
                }
                const slip = processedData.receipts.find(r => r.id === intervention.id);
                if (slip && !slip.type.includes('pdf')) {
                    preprocessImage(slip.url, { contrast: imgContrast, brightness: imgBrightness, thresholdUpper: imgThreshold })
                        .then(url => setCustomPreviewUrl(url));
                }
            }, [intervention, imgContrast, imgBrightness, imgThreshold, processedData.receipts]);

            const terminatePool = async () => {
                if (schedulerRef.current) {
                    await schedulerRef.current.terminate();
                    schedulerRef.current = null;
                }
                workerPoolRef.current = [];
            };

            const initEngine = async () => {
                try {
                    await terminatePool();
                    const scheduler = Tesseract.createScheduler();
                    const poolCount = poolSizeRef.current;
                    for (let i = 0; i < poolCount; i++) {
                        const worker = await Tesseract.createWorker('eng');
                        scheduler.addWorker(worker);
                        workerPoolRef.current.push(worker);
                    }
                    schedulerRef.current = scheduler;
                    setStatus(`Engine Ready (${poolCount} Multi-threaded Workers Active)`);
                } catch (e) { setStatus("OCR Engine Init Error"); }
            };

            const saveToDB = async () => {
                try {
                    const payload = {
                        config, results,
                        data: { studentMap: processedData.studentMap, bankList: processedData.bankList, familyLinks: processedData.familyLinks },
                        status: { master: assetStatus.master, bank: assetStatus.bank, family: assetStatus.family, slips: false },
                        timestamp: new Date().getTime(),
                        ocrCache: cacheRef.current
                    };
                    await idbKeyval.set(DB_KEY, payload);
                    setLastSaved(new Date());
                } catch (e) { console.error("Save Error", e); }
            };

            const loadFromDB = async () => {
                try {
                    const saved = await idbKeyval.get(DB_KEY);
                    if (saved) {
                        setConfig(prev => ({ ...prev, ...(saved.config || {}) }));
                        setResults(saved.results || []);
                        setProcessedData(prev => ({
                            ...prev,
                            studentMap: saved.data?.studentMap || {},
                            bankList: saved.data?.bankList || [],
                            familyLinks: saved.data?.familyLinks || {}
                        }));
                        setAssetStatus(saved.status || assetStatus);
                        if (saved.ocrCache) cacheRef.current = saved.ocrCache;
                        setStatus(saved.results?.length > 0 ? "Session Restored from Storage" : "Engine Ready");
                    }
                } catch (e) { console.error("Load Error", e); }
            };

            const resetSystem = () => {
                setConfirmDialog({
                    title: "RESET SYSTEM",
                    message: "Are you sure you want to clear all imported datasets, cached OCR entries, and current audit state?",
                    onConfirm: async () => {
                        await idbKeyval.del(DB_KEY);
                        window.location.reload();
                    }
                });
            };

            const startOcrQueue = async (newItems = []) => {
                const existingIds = new Set(queueRef.current.map(i => i.id));
                const uniqueNew = newItems.filter(i => !existingIds.has(i.id) && !cacheRef.current[i.name]);

                if (uniqueNew.length === 0) return;

                queueRef.current = [...queueRef.current, ...uniqueNew];
                setOcrProgress(prev => ({ 
                    ...prev, 
                    total: queueRef.current.length + Object.keys(cacheRef.current).length, 
                    processed: Object.keys(cacheRef.current).length 
                }));

                if (!processingRef.current) {
                    processingRef.current = true;
                    setOcrProgress(prev => ({ ...prev, isRunning: true }));
                    processQueueLoop();
                }
            };

            const processQueueLoop = async () => {
                while (queueRef.current.length > 0 && processingRef.current) {
                    if (!schedulerRef.current) await initEngine();

                    const batchSize = poolSizeRef.current;
                    const batch = queueRef.current.splice(0, batchSize);
                    setOcrProgress(prev => ({ ...prev, text: `Parallel Scanning Batch (${batch.length} slips)...` }));

                    const batchPromises = batch.map(async (doc) => {
                        let text = "Unreadable";
                        let slipData = { amount: null, trace: null, potentialRefs: [], detectedDate: null };

                        try {
                            let imageToScan = doc.url;
                            if (doc.type === 'application/pdf') {
                                const pdf = await pdfjsLib.getDocument(doc.url).promise;
                                const page = await pdf.getPage(1);
                                const viewport = page.getViewport({ scale: 2.0 });
                                const canvas = document.createElement('canvas');
                                const context = canvas.getContext('2d');
                                canvas.height = viewport.height;
                                canvas.width = viewport.width;
                                await page.render({ canvasContext: context, viewport: viewport }).promise;
                                imageToScan = canvas.toDataURL('image/jpeg');
                            }
                            const processedImg = await preprocessImage(imageToScan);
                            
                            const ret = await schedulerRef.current.addJob('recognize', processedImg);
                            text = ret.data.text;
                            slipData = extractSlipData(text);
                        } catch (err) {
                            text = `Error: ${err.message}`;
                        }

                        cacheRef.current[doc.name] = { text, ...slipData };

                        const student = processedData.studentMap[doc.id];
                        if (student) {
                            const cluster = processedData.familyLinks[doc.id] || [doc.id];
                            const newResult = analyzeStudent(student, cluster, bankIndexRef.current, config, processedData.bankList, processedData.studentMap, { text, ...slipData });
                            setResults(prevResults => prevResults.map(r => r.id === doc.id ? newResult : r));
                        }
                    });

                    await Promise.all(batchPromises);

                    setOcrProgress(prev => ({ 
                        ...prev, 
                        processed: Object.keys(cacheRef.current).length,
                        text: queueRef.current.length > 0 ? "Next Parallel Batch..." : "Idle"
                    }));

                    await new Promise(r => setTimeout(r, 20));
                }

                processingRef.current = false;
                setOcrProgress(prev => ({ ...prev, isRunning: false, text: "Idle" }));
                setStatus("Multi-threaded OCR Complete");
            };

            const stopOcr = () => { processingRef.current = false; setOcrProgress(prev => ({ ...prev, isRunning: false, text: "Paused" })); };
            const skipCurrentOcr = () => { skipCurrentRef.current = true; };

            const rescanModalImage = async () => {
                if (!intervention) return;
                const slip = processedData.receipts.find(r => r.id === intervention.id);
                if (!slip) return showToast("No image slip loaded for this student.", "error");

                setIsRescanning(true);
                try {
                    let imageToScan = slip.url;
                    if (slip.type.includes('pdf')) {
                        const pdf = await pdfjsLib.getDocument(slip.url).promise;
                        const page = await pdf.getPage(1);
                        const viewport = page.getViewport({ scale: 2.0 });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;
                        await page.render({ canvasContext: context, viewport: viewport }).promise;
                        imageToScan = canvas.toDataURL('image/jpeg');
                    }

                    const enhancedImg = await preprocessImage(imageToScan, { contrast: imgContrast, brightness: imgBrightness, thresholdUpper: imgThreshold });
                    const res = await schedulerRef.current.addJob('recognize', enhancedImg);
                    const text = res.data.text;
                    const slipData = extractSlipData(text);

                    cacheRef.current[slip.name] = { text, ...slipData };

                    const student = processedData.studentMap[intervention.id];
                    const cluster = processedData.familyLinks[intervention.id] || [intervention.id];
                    const updatedRes = analyzeStudent(student, cluster, bankIndexRef.current, config, processedData.bankList, processedData.studentMap, { text, ...slipData });
                    
                    setResults(prev => prev.map(r => r.id === intervention.id ? updatedRes : r));
                    setIntervention(updatedRes);
                    setModalNote(updatedRes.forensicNote || "");
                    showToast("OCR re-scan completed with updated image filters!", "success");
                } catch (e) {
                    showToast(`Re-scan failed: ${e.message}`, "error");
                } finally {
                    setIsRescanning(false);
                }
            };

            const processFileList = async (files) => {
                if (!files || files.length === 0) return;
                setStatus("Reading & Classifying Files...");

                let newReceipts = [];
                let newBank = [...processedData.bankList];
                let newMaster = { ...processedData.studentMap };
                let familyLinksObj = { ...processedData.familyLinks };
                if (Array.isArray(familyLinksObj)) familyLinksObj = {}; 

                let found = { ...assetStatus };

                for (const file of files) {
                    const name = file.name.toLowerCase();
                    const isSlip = name.endsWith('.jpg') || name.endsWith('.png') || name.endsWith('.pdf') || name.endsWith('.jpeg');
                    const isSpreadsheet = name.endsWith('.csv') || name.endsWith('.xlsx') || name.endsWith('.xls');

                    if (isSpreadsheet || name.includes('master') || name.includes('bank') || name.includes('family')) {
                        try {
                            const buffer = await file.arrayBuffer();
                            const wb = XLSX.read(new Uint8Array(buffer), { type: 'array', cellDates: true });
                            const sheetName = wb.SheetNames[0];
                            const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: false, defval: "" });

                            if (rows.length === 0) continue;

                            let headerRowIdx = rows.findIndex(r => r.some(c => c && /student name|name|student id|token|transaction date|credit|family id/i.test(c.toString())));
                            if (headerRowIdx === -1) headerRowIdx = 0;

                            const headers = (rows[headerRowIdx] || []).map(h => (h || "").toString().toLowerCase().trim());
                            const dataRows = rows.slice(headerRowIdx + 1);

                            const isMasterCSV = name.includes('master') || headers.some(h => h.includes('student name') || h.includes('student id') || h.includes('token'));
                            const isBankCSV = name.includes('bank') || headers.some(h => h.includes('transaction date') || h.includes('credit') || h.includes('debit'));
                            const isFamilyCSV = name.includes('family') || headers.some(h => h.includes('family id') || h.includes('member ids') || h.includes('cluster'));

                            if (isMasterCSV) {
                                const idIdx = headers.findIndex(h => h.includes('id') || h.includes('token')) !== -1 ? headers.findIndex(h => h.includes('id') || h.includes('token')) : 2;
                                const nameIdx = headers.findIndex(h => h.includes('name')) !== -1 ? headers.findIndex(h => h.includes('name')) : 3;
                                const gradeIdx = headers.findIndex(h => h.includes('grade')) !== -1 ? headers.findIndex(h => h.includes('grade')) : 1;
                                const dateIdx = headers.findIndex(h => h.includes('timestamp') || h.includes('date')) !== -1 ? headers.findIndex(h => h.includes('timestamp') || h.includes('date')) : 0;
                                const monthIdx = headers.findIndex(h => h.includes('month')) !== -1 ? headers.findIndex(h => h.includes('month')) : 4;
                                const infoIdx = headers.findIndex(h => h.includes('payment') || h.includes('info')) !== -1 ? headers.findIndex(h => h.includes('payment') || h.includes('info')) : 5;
                                const linkIdx = headers.findIndex(h => h.includes('link') || h.includes('url')) !== -1 ? headers.findIndex(h => h.includes('link') || h.includes('url')) : 6;
                                const notesIdx = headers.findIndex(h => h.includes('note')) !== -1 ? headers.findIndex(h => h.includes('note')) : 7;

                                dataRows.forEach(r => {
                                    const id = (r[idIdx] || "").toString().trim();
                                    const timestamp = parseDate(r[dateIdx]);
                                    if (id) {
                                        newMaster[id] = {
                                            uploadTimestamp: timestamp,
                                            grade: r[gradeIdx] || 'Grade 1',
                                            token: id,
                                            name: r[nameIdx] || 'Unknown Student',
                                            month: r[monthIdx] || '',
                                            paymentInfo: r[infoIdx] || '',
                                            link: r[linkIdx] || '',
                                            notes: r[notesIdx] || ''
                                        };
                                    }
                                });
                                found.master = true;
                            } else if (isBankCSV) {
                                const dateIdx = headers.findIndex(h => h.includes('date')) !== -1 ? headers.findIndex(h => h.includes('date')) : 0;
                                const descIdx = headers.findIndex(h => h.includes('desc') || h.includes('particular') || h.includes('detail') || h.includes('narration')) !== -1 ? headers.findIndex(h => h.includes('desc') || h.includes('particular') || h.includes('detail') || h.includes('narration')) : 2;
                                const creditIdx = headers.findIndex(h => h.includes('credit') || h.includes('deposit') || h.includes('amount')) !== -1 ? headers.findIndex(h => h.includes('credit') || h.includes('deposit') || h.includes('amount')) : 5;

                                dataRows.forEach((r, idx) => {
                                    const rawVal = (r[creditIdx] !== undefined ? r[creditIdx] : (r[5] || r[7] || "0")).toString().replace(/,/g, '');
                                    const credit = parseFloat(rawVal);
                                    const desc = normalize(r[descIdx] !== undefined ? r[descIdx] : r[2]);
                                    const txnDate = parseDate(r[dateIdx] !== undefined ? r[dateIdx] : r[0]);

                                    if (!isNaN(credit) && credit > 0) {
                                        newBank.push({
                                            id: `TXN-${idx}-${Date.now()}`,
                                            date: txnDate,
                                            desc: desc,
                                            amount: credit,
                                            raw: r
                                        });
                                    }
                                });
                                found.bank = true;
                            } else if (isFamilyCSV) {
                                const idFieldIdx = headers.findIndex(h => h.includes('member') || h.includes('family') || h.includes('id')) !== -1 ? headers.findIndex(h => h.includes('member') || h.includes('family') || h.includes('id')) : 2;

                                dataRows.forEach(r => {
                                    const idField = r[idFieldIdx] || r[0];
                                    if (idField) {
                                        const cluster = idField.toString().split('-').map(s => s.trim()).filter(Boolean);
                                        if (cluster.length > 0) cluster.forEach(mid => familyLinksObj[mid] = cluster);
                                    }
                                });
                                found.family = true;
                            }
                        } catch (err) {
                            console.error(`Error parsing spreadsheet file ${file.name}:`, err);
                        }
                    } else if (isSlip) {
                        const folder = (file.webkitRelativePath || "").split('/').reverse()[1] || "Unsorted";
                        const idFromFolder = (folder.match(/\d+/) || [file.name.match(/\d+/)?.[0] || ""])[0];
                        newReceipts.push({ file, id: idFromFolder, name: file.name, url: URL.createObjectURL(file), type: file.type });
                        found.slips = true;
                    }
                }

                setProcessedData({
                    studentMap: newMaster,
                    bankList: newBank,
                    familyLinks: familyLinksObj,
                    receipts: [...processedData.receipts, ...newReceipts]
                });
                setAssetStatus(found);
                setStatus(`Loaded: ${Object.keys(newMaster).length} Students, ${newBank.length} Bank TXNs`);
                showToast(`Assets Updated: ${Object.keys(newMaster).length} Students, ${newBank.length} Bank Credits loaded.`, "info");
            };

            const handleFiles = (e) => {
                const files = Array.from(e.target.files || []);
                processFileList(files);
            };

            const handleDrop = (e) => {
                e.preventDefault();
                e.stopPropagation();
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    processFileList(Array.from(e.dataTransfer.files));
                }
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                e.stopPropagation();
            };

            // --- SECONDARY AUDIT FILE PROCESSOR ---
            const handleSecondaryFiles = async (e) => {
                const files = Array.from(e.target.files || []);
                if (files.length === 0) return;

                setSecondaryStatus("Processing Secondary Audit Datasets...");
                let newReportRows = [...secondaryReportData];
                let newSlips = [...secondarySlips];
                let newMaster = { ...secondaryMasterMap };
                let newFamily = { ...secondaryFamilyMap };

                for (const file of files) {
                    const name = file.name.toLowerCase();
                    const isSpreadsheet = name.endsWith('.csv') || name.endsWith('.xlsx') || name.endsWith('.xls');
                    const isSlip = name.endsWith('.jpg') || name.endsWith('.jpeg') || name.endsWith('.png') || name.endsWith('.pdf');

                    if (isSpreadsheet) {
                        try {
                            const buffer = await file.arrayBuffer();
                            const wb = XLSX.read(new Uint8Array(buffer), { type: 'array', cellDates: true });
                            
                            // Iterate over all sheets (e.g., Future Payments, Late Fees Not Paid, Master Audit, etc.)
                            wb.SheetNames.forEach(sheetName => {
                                const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { header: 1, raw: false, defval: "" });
                                if (rows.length < 2) return;

                                let headerRowIdx = rows.findIndex(r => r.some(c => c && /token id|student name|status|auditor comment/i.test(c.toString())));
                                if (headerRowIdx === -1) headerRowIdx = 0;

                                const headers = (rows[headerRowIdx] || []).map(h => (h || "").toString().toLowerCase().trim());
                                const dataRows = rows.slice(headerRowIdx + 1);

                                const isMasterCSV = name.includes('master') || (headers.includes('student name') && !headers.includes('auditor comment'));
                                const isFamilyCSV = name.includes('family') || headers.includes('family id') || headers.includes('member ids');

                                if (isMasterCSV) {
                                    const idIdx = headers.findIndex(h => h.includes('id') || h.includes('token')) !== -1 ? headers.findIndex(h => h.includes('id') || h.includes('token')) : 0;
                                    const nameIdx = headers.findIndex(h => h.includes('name')) !== -1 ? headers.findIndex(h => h.includes('name')) : 1;
                                    const gradeIdx = headers.findIndex(h => h.includes('grade')) !== -1 ? headers.findIndex(h => h.includes('grade')) : 2;
                                    dataRows.forEach(r => {
                                        const id = (r[idIdx] || "").toString().trim();
                                        if (id) newMaster[id] = { token: id, name: r[nameIdx] || 'Student', grade: r[gradeIdx] || 'Grade 1' };
                                    });
                                } else if (isFamilyCSV) {
                                    const idFieldIdx = headers.findIndex(h => h.includes('member') || h.includes('family') || h.includes('id')) !== -1 ? headers.findIndex(h => h.includes('member') || h.includes('family') || h.includes('id')) : 0;
                                    dataRows.forEach(r => {
                                        const idField = r[idFieldIdx] || r[0];
                                        if (idField) {
                                            const cluster = idField.toString().split('-').map(s => s.trim()).filter(Boolean);
                                            if (cluster.length > 0) cluster.forEach(mid => newFamily[mid] = cluster);
                                        }
                                    });
                                } else {
                                    // Main Audited Findings Report Sheet
                                    const tokenIdx = headers.findIndex(h => h.includes('token')) !== -1 ? headers.findIndex(h => h.includes('token')) : 0;
                                    const nameIdx = headers.findIndex(h => h.includes('name')) !== -1 ? headers.findIndex(h => h.includes('name')) : 1;
                                    const gradeIdx = headers.findIndex(h => h.includes('grade')) !== -1 ? headers.findIndex(h => h.includes('grade')) : 2;
                                    const statusIdx = headers.findIndex(h => h.includes('status')) !== -1 ? headers.findIndex(h => h.includes('status')) : 3;
                                    const paidIdx = headers.findIndex(h => h.includes('amount paid') || h.includes('paid')) !== -1 ? headers.findIndex(h => h.includes('amount paid') || h.includes('paid')) : 4;
                                    const baseIdx = headers.findIndex(h => h.includes('base fee')) !== -1 ? headers.findIndex(h => h.includes('base fee')) : 5;
                                    const lateIdx = headers.findIndex(h => h.includes('late fee')) !== -1 ? headers.findIndex(h => h.includes('late fee')) : 6;
                                    const totalIdx = headers.findIndex(h => h.includes('total expected')) !== -1 ? headers.findIndex(h => h.includes('total expected')) : 7;
                                    const lateSubIdx = headers.findIndex(h => h.includes('late submission')) !== -1 ? headers.findIndex(h => h.includes('late submission')) : 8;
                                    const linkIdx = headers.findIndex(h => h.includes('link') || h.includes('url')) !== -1 ? headers.findIndex(h => h.includes('link') || h.includes('url')) : 9;
                                    const ocrAmtIdx = headers.findIndex(h => h.includes('ocr amount')) !== -1 ? headers.findIndex(h => h.includes('ocr amount')) : 10;
                                    const dateIdx = headers.findIndex(h => h.includes('date')) !== -1 ? headers.findIndex(h => h.includes('date')) : 11;
                                    const bankDescIdx = headers.findIndex(h => h.includes('bank description')) !== -1 ? headers.findIndex(h => h.includes('bank description')) : 12;
                                    const commentIdx = headers.findIndex(h => h.includes('comment') || h.includes('remark')) !== -1 ? headers.findIndex(h => h.includes('comment') || h.includes('remark')) : 14;

                                    dataRows.forEach((r, idx) => {
                                        const token = (r[tokenIdx] || "").toString().trim();
                                        const nameVal = (r[nameIdx] || "").toString().trim();
                                        if (token || nameVal) {
                                            const existingIdx = newReportRows.findIndex(item => item.token === token && item.name === nameVal);
                                            const rec = {
                                                id: `SEC-${token || idx}-${sheetName}`,
                                                token: token || `TOK-${idx}`,
                                                name: nameVal || 'Student',
                                                grade: r[gradeIdx] || 'Grade 1',
                                                status: (r[statusIdx] || 'UNMATCHED').toString().toUpperCase(),
                                                paid: parseFloat((r[paidIdx] || "0").toString().replace(/,/g, '')) || 0,
                                                baseFee: parseFloat((r[baseIdx] || "0").toString().replace(/,/g, '')) || 0,
                                                lateFee: parseFloat((r[lateIdx] || "0").toString().replace(/,/g, '')) || 0,
                                                totalExpected: parseFloat((r[totalIdx] || "0").toString().replace(/,/g, '')) || 0,
                                                isLateSubmission: (r[lateSubIdx] || "").toString().toUpperCase() === 'YES',
                                                link: r[linkIdx] || '',
                                                ocrAmount: r[ocrAmtIdx] || '',
                                                date: r[dateIdx] || '',
                                                bankDesc: r[bankDescIdx] || 'N/A',
                                                comment: r[commentIdx] || sheetName || 'Pending Audit Review',
                                                sheetCategory: sheetName
                                            };
                                            if (existingIdx !== -1) {
                                                newReportRows[existingIdx] = rec;
                                            } else {
                                                newReportRows.push(rec);
                                            }
                                        }
                                    });
                                }
                            });
                        } catch (err) {
                            console.error("Secondary Report File Error:", err);
                        }
                    } else if (isSlip) {
                        const folder = (file.webkitRelativePath || "").split('/').reverse()[1] || "Unsorted";
                        const idFromFolder = (folder.match(/\d+/) || [file.name.match(/\d+/)?.[0] || ""])[0];
                        newSlips.push({
                            id: idFromFolder || file.name,
                            name: file.name,
                            url: URL.createObjectURL(file),
                            type: file.type
                        });
                    }
                }

                setSecondaryReportData(newReportRows);
                setSecondarySlips(newSlips);
                setSecondaryMasterMap(newMaster);
                setSecondaryFamilyMap(newFamily);
                setSecondaryStatus(`Secondary Workflow Active: ${newReportRows.length} Findings, ${newSlips.length} Slips Loaded`);
                if (newReportRows.length > 0) setSelectedSecondaryStudent(newReportRows[0]);
                showToast(`Loaded ${newReportRows.length} audit finding records & ${newSlips.length} payment slips.`, "success");
            };

            const downloadParentCard = async () => {
                if (!parentCardRef.current || !selectedSecondaryStudent) return;
                try {
                    showToast("Generating Authentic Parent Audit Card...", "info");
                    const canvas = await html2canvas(parentCardRef.current, {
                        scale: 2.5,
                        backgroundColor: '#0b0f19',
                        useCORS: true,
                        allowTaint: true,
                        logging: false
                    });
                    const link = document.createElement('a');
                    const cleanName = (selectedSecondaryStudent.name || 'Student').replace(/[^A-Z0-9]/gi, '_');
                    link.download = `Audit_Verification_Notice_${selectedSecondaryStudent.token}_${cleanName}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast("Parent Audit Certificate Image saved successfully!", "success");
                } catch (err) {
                    showToast(`Failed to generate parent image: ${err.message}`, "error");
                }
            };

            // Secondary Filtered Findings
            const secondaryCategories = useMemo(() => {
                const cats = new Set(secondaryReportData.map(r => r.sheetCategory || 'General'));
                return ['all', ...Array.from(cats)];
            }, [secondaryReportData]);

            const filteredSecondaryReport = useMemo(() => {
                return secondaryReportData.filter(r => {
                    const matchCat = secondaryCategoryFilter === 'all' || r.sheetCategory === secondaryCategoryFilter;
                    const q = secondarySearchQuery.toLowerCase();
                    const matchSearch = !q || 
                        r.name.toLowerCase().includes(q) || 
                        r.token.toLowerCase().includes(q) || 
                        (r.comment && r.comment.toLowerCase().includes(q));
                    return matchCat && matchSearch;
                });
            }, [secondaryReportData, secondaryCategoryFilter, secondarySearchQuery]);

            const selectedSecondarySlip = useMemo(() => {
                if (!selectedSecondaryStudent) return null;
                // Match slip by token ID or student name in filename
                return secondarySlips.find(s => s.id === selectedSecondaryStudent.token || s.name.includes(selectedSecondaryStudent.token) || s.name.toUpperCase().includes(selectedSecondaryStudent.name.toUpperCase())) ||
                       processedData.receipts.find(r => r.id === selectedSecondaryStudent.token);
            }, [selectedSecondaryStudent, secondarySlips, processedData.receipts]);


            const analyzeStudent = (student, cluster, bankIndex, currentConfig, fullBankList, allStudentsMap, ocrData = null) => {
                const penaltyDate = parseDate(currentConfig.lateLogicStart);
                const { amount: slipAmount, trace: slipTrace, potentialRefs: slipRefs = [], detectedDate: slipDate } = ocrData || {};

                let matchedTxns = [];

                cluster.forEach(cid => {
                    if (bankIndex.has(cid)) {
                        bankIndex.get(cid).forEach(txn => {
                            matchedTxns.push({ ...txn, method: 'Token Match ID', confidence: 100 });
                        });
                    }
                });

                if (matchedTxns.length === 0 && student.name && student.name.length > 3) {
                    const nameUpper = student.name.toUpperCase();
                    fullBankList.forEach(txn => {
                        if (txn.desc.includes(nameUpper)) {
                            matchedTxns.push({ ...txn, method: 'Exact Name Match', confidence: 95 });
                        }
                    });
                }

                if (matchedTxns.length === 0 && student.name) {
                    fullBankList.forEach(txn => {
                        const sim = fuzzyNameSimilarity(student.name, txn.desc);
                        if (sim >= 80) {
                            matchedTxns.push({ ...txn, method: `Fuzzy Name (${sim}%)`, confidence: sim });
                        }
                    });
                }

                if (matchedTxns.length === 0 && ocrData) {
                    if (slipTrace) {
                        fullBankList.forEach(txn => {
                            if (txn.desc.includes(slipTrace)) matchedTxns.push({ ...txn, method: `OCR Trace #${slipTrace}`, confidence: 92 });
                        });
                    }
                    if (matchedTxns.length === 0) {
                        slipRefs.forEach(ref => {
                            fullBankList.forEach(txn => {
                                if (txn.desc.includes(ref)) matchedTxns.push({ ...txn, method: `OCR Ref ${ref}`, confidence: 88 });
                            });
                        });
                    }
                    if (matchedTxns.length === 0 && slipAmount) {
                        fullBankList.filter(t => Math.abs(t.amount - slipAmount) < 1.0).forEach(txn => {
                            matchedTxns.push({ ...txn, method: 'OCR Amount Match', confidence: 65 });
                        });
                    }
                }

                matchedTxns = [...new Map(matchedTxns.map(item => [item.id, item])).values()].sort((a,b) => b.confidence - a.confidence);

                const totalPaid = matchedTxns.reduce((sum, t) => sum + t.amount, 0);
                const dates = matchedTxns.map(t => t.date).filter(Boolean);
                const effDate = dates.length > 0 ? new Date(Math.min(...dates)) : (slipDate || student.uploadTimestamp);

                let expectedBaseFee = 0;
                cluster.forEach(memberId => {
                    const mem = allStudentsMap[memberId] || (memberId === student.token ? student : null);
                    const gNum = mem ? parseGradeNumber(mem.grade) : parseGradeNumber(student.grade);
                    const feeForGrade = Number(currentConfig.gradeFees[gNum] || 3000);
                    expectedBaseFee += feeForGrade;
                });

                const isLateSubmission = effDate && penaltyDate && effDate >= penaltyDate;
                const requiredLateFee = isLateSubmission ? Number(currentConfig.lateFee) : 0;
                const totalExpected = expectedBaseFee + requiredLateFee;

                let statusType = 'unmatched';
                let autoComment = "";

                if (totalPaid >= totalExpected) {
                    statusType = 'confirmed';
                    autoComment = isLateSubmission 
                        ? `VERIFIED: Base Fee (Rs.${expectedBaseFee}) + Late Fee (Rs.${requiredLateFee}) fully satisfied.`
                        : `VERIFIED: Base Fee (Rs.${expectedBaseFee}) paid in full.`;
                } else if (totalPaid >= expectedBaseFee && isLateSubmission) {
                    statusType = 'late_fee_missing';
                    autoComment = `Late Fees Not Paid`;
                } else if (totalPaid > 0) {
                    statusType = 'odd';
                    autoComment = `FLAGGED: Partial Amount (Paid Rs.${totalPaid} vs Expected Rs.${totalExpected})`;
                } else {
                    statusType = 'unmatched';
                    autoComment = "Not Available in Bank Statement";
                }

                const infoStr = (student.paymentInfo || "").toString().trim().toUpperCase();
                const notesStr = (student.notes || "").toString().trim();
                const monthStr = (student.month || "").toString().trim();
                
                const isFuturePayment = infoStr.startsWith('OTHER') || 
                                        /future|next month|advance|other month/i.test(notesStr) ||
                                        /future|next month|advance|other month/i.test(infoStr) ||
                                        (monthStr && monthStr.toLowerCase() !== currentConfig.auditMonth.toLowerCase() && monthStr.length > 2);

                return {
                    id: student.token,
                    folder: student.name,
                    grade: student.grade,
                    paid: totalPaid,
                    statusType,
                    effDate,
                    expected: totalExpected,
                    baseExpected: expectedBaseFee,
                    lateFeeAmount: requiredLateFee,
                    isLateSubmission,
                    matches: matchedTxns,
                    link: student.link,
                    forensicNote: autoComment,
                    ocrAmount: slipAmount,
                    ocrTrace: slipTrace,
                    paymentInfo: student.paymentInfo,
                    notes: student.notes,
                    month: student.month,
                    isFuturePayment: isFuturePayment,
                    timestamp: new Date().toLocaleString(),
                    isAudited: false
                };
            };

            const runSmartAudit = async () => {
                if (!assetStatus.master || !assetStatus.bank) {
                    return showToast("Please load Master Student CSV and Bank Statement CSV first.", "error");
                }
                setIsAuditing(true);
                setResults([]);

                const { studentMap, bankList, familyLinks } = processedData;

                setStatus("Indexing Bank Transactions...");

                const bankTokenMap = new Map(); 
                const extractVBATokens = (str) => {
                    if (!str) return [];
                    const matches = str.match(/\b\d{3,5}\b/g) || [];
                    const exclusions = ['2023', '2024', '2025', '2026', '2027', '2028'];
                    return matches.filter(m => !exclusions.includes(m));
                };

                bankList.forEach(txn => {
                    const tokens = extractVBATokens(txn.desc);
                    tokens.forEach(t => {
                        if (!bankTokenMap.has(t)) bankTokenMap.set(t, []);
                        bankTokenMap.get(t).push(txn);
                    });
                });
                bankIndexRef.current = bankTokenMap;

                setStatus("Executing Audit Logic...");

                const initialResults = [];
                const slipsToScan = [];
                const allIds = Object.keys(studentMap);

                for (const sid of allIds) {
                    const student = studentMap[sid];
                    const cluster = familyLinks[sid] || [sid];
                    const slip = processedData.receipts.find(r => r.id === sid);
                    const cachedOcr = slip ? cacheRef.current[slip.name] : null;

                    const res = analyzeStudent(student, cluster, bankTokenMap, config, bankList, studentMap, cachedOcr);
                    const hasStrongMatch = res.matches.some(m => m.confidence >= 80);

                    if (hasStrongMatch) {
                        initialResults.push(res);
                    } else {
                        if (slip) {
                            initialResults.push({ ...res, statusType: 'scanning', forensicNote: "Queued for Vision OCR Analysis..." });
                            if (!cachedOcr) slipsToScan.push(slip);
                        } else {
                            initialResults.push(res);
                        }
                    }
                }

                setResults(initialResults);

                if (slipsToScan.length > 0) {
                    setStatus(`Queued ${slipsToScan.length} receipts across worker pool...`);
                    startOcrQueue(slipsToScan);
                } else {
                    setStatus("Audit Execution Complete");
                }

                setIsAuditing(false);
            };

            const openReview = (res) => { 
                setIntervention(res); 
                setModalNote(res.forensicNote || ""); 
                setIsReviewMode(true);
                setImgContrast(1.4);
                setImgBrightness(0);
                setImgThreshold(160);
            };

            const saveReviewAndNext = () => {
                if (!intervention) return;

                const currentIdx = filteredResults.findIndex(r => r.id === intervention.id);
                const updatedResults = results.map(r => 
                    r.id === intervention.id 
                        ? { ...r, forensicNote: modalNote, isAudited: true } 
                        : r
                );
                setResults(updatedResults);

                if (currentIdx !== -1 && currentIdx + 1 < filteredResults.length) {
                    const nextItem = filteredResults[currentIdx + 1];
                    const updatedNext = updatedResults.find(r => r.id === nextItem.id) || nextItem;
                    setIntervention(updatedNext);
                    setModalNote(updatedNext.forensicNote || "");
                } else {
                    setIntervention(null);
                    setIsReviewMode(false);
                    setStatus("Manual Audit complete for this view!");
                    showToast("Manual Audit complete for current view!", "success");
                }
            };

            const closeReview = () => { setIntervention(null); setIsReviewMode(false); };

            const continueManualAudit = () => {
                if (results.length === 0) return showToast("Please load datasets and run the audit first.", "error");

                const nextUnaudited = results.find(r => !r.isAudited);
                if (nextUnaudited) {
                    openReview(nextUnaudited);
                } else {
                    showToast("All entries have already been manually audited!", "info");
                    openReview(results[0]);
                }
            };

            const isAuditFullyComplete = useMemo(() => {
                return results.length > 0 && results.every(r => r.isAudited);
            }, [results]);

            const auditedCount = useMemo(() => {
                return results.filter(r => r.isAudited).length;
            }, [results]);

            const toggleSelectAll = () => {
                if (selectedTokens.length === filteredResults.length) {
                    setSelectedTokens([]);
                } else {
                    setSelectedTokens(filteredResults.map(r => r.id));
                }
            };

            const toggleSelectToken = (id) => {
                setSelectedTokens(prev => prev.includes(id) ? prev.filter(i => i !== id) : [...prev, id]);
            };

            const batchSetStatus = (statusLabel) => {
                if (selectedTokens.length === 0) return showToast("Select items first using checkboxes.", "error");
                setResults(prev => prev.map(r => selectedTokens.includes(r.id) ? { ...r, forensicNote: statusLabel, isAudited: true } : r));
                setSelectedTokens([]);
                showToast(`Batch updated ${selectedTokens.length} records!`, "success");
            };

            const downloadEvidence = async () => {
                if (!captureAreaRef.current) return;
                try {
                    showToast("Generating evidence image...", "info");
                    const canvas = await html2canvas(captureAreaRef.current, { 
                        scale: 2, 
                        backgroundColor: '#0f172a',
                        useCORS: true,
                        allowTaint: true,
                        logging: false
                    });
                    const link = document.createElement('a');
                    const studentName = (intervention.folder || 'Student').replace(/[^A-[a-z0-9]/gi, '_');
                    link.download = `Audit_Evidence_${intervention.id}_${studentName}.png`;
                    link.href = canvas.toDataURL('image/png');
                    link.click();
                    showToast("Evidence snapshot downloaded successfully!", "success");
                } catch (e) {
                    console.error("Evidence capture error:", e);
                    showToast(`Could not capture evidence: ${e.message}`, "error");
                }
            };

            const exportReport = () => {
                if (results.length === 0) {
                    return showToast("No audit results available to export. Please run the audit first.", "error");
                }

                const mapRecordToExportRow = (r) => {
                    const matchedBankDescs = r.matches && r.matches.length > 0 ? r.matches.map(m => m.desc).join(' | ') : 'N/A';
                    const matchedBankAmts = r.matches && r.matches.length > 0 ? r.matches.map(m => `Rs.${m.amount}`).join(' | ') : '0';

                    return {
                        'Token ID': r.id, 
                        'Student Name': r.folder, 
                        'Grade': r.grade || '-',
                        'Status': r.statusType.toUpperCase(), 
                        'Amount Paid (LKR)': r.paid, 
                        'Base Fee Expected (LKR)': r.baseExpected,
                        'Late Fee Required (LKR)': r.lateFeeAmount,
                        'Total Expected (LKR)': r.expected,
                        'Late Submission': r.isLateSubmission ? 'YES' : 'NO',
                        'OneDrive / Slip Link': r.link || '-',
                        'OCR Amount Read': r.ocrAmount || '-', 
                        'Payment / Upload Date': r.effDate ? r.effDate.toLocaleDateString() : '-',
                        'Matched Bank Description': matchedBankDescs,
                        'Matched Bank Amount': matchedBankAmts,
                        'Auditor Comment': r.forensicNote || ''
                    };
                };

                const wb = XLSX.utils.book_new();

                const futurePayments = results.filter(r => r.isFuturePayment);
                if (futurePayments.length > 0) {
                    const futureData = futurePayments.map(mapRecordToExportRow);
                    const wsFuture = XLSX.utils.json_to_sheet(futureData);
                    XLSX.utils.book_append_sheet(wb, wsFuture, "Future Payments");
                }

                STANDARD_COMMENTS.forEach(stdComment => {
                    const matchingRecords = results.filter(r => 
                        !r.isFuturePayment && r.forensicNote && r.forensicNote.trim().toLowerCase().startsWith(stdComment.toLowerCase())
                    );

                    if (matchingRecords.length > 0) {
                        const stdData = matchingRecords.map(mapRecordToExportRow);
                        const wsStd = XLSX.utils.json_to_sheet(stdData);
                        let cleanTabName = stdComment.replace(/[:\\/?*\[\]]/g, '').substring(0, 30).trim();
                        XLSX.utils.book_append_sheet(wb, wsStd, cleanTabName);
                    }
                });

                const otherRecords = results.filter(r => {
                    if (r.isFuturePayment) return false;
                    const note = (r.forensicNote || "").trim();
                    if (!note) return true;
                    const isStandard = STANDARD_COMMENTS.some(sc => note.toLowerCase().startsWith(sc.toLowerCase()));
                    return !isStandard;
                });

                if (otherRecords.length > 0) {
                    const otherData = otherRecords.map(mapRecordToExportRow);
                    const wsOther = XLSX.utils.json_to_sheet(otherData);
                    XLSX.utils.book_append_sheet(wb, wsOther, "Other");
                }

                if (wb.SheetNames.length === 0) {
                    const allData = results.map(mapRecordToExportRow);
                    const wsAll = XLSX.utils.json_to_sheet(allData);
                    XLSX.utils.book_append_sheet(wb, wsAll, "Master Audit");
                }

                XLSX.writeFile(wb, `AuditCore_Report_${config.auditMonth.replace(/\s+/g, '_')}_v23.xlsx`);
                showToast("Multi-tab Excel report exported successfully!", "success");
            };

            const exportLateFeeReport = () => {
                const lateFeeMissingList = results.filter(r => r.statusType === 'late_fee_missing');
                if (lateFeeMissingList.length === 0) return showToast("No missing late fee defaulters found.", "info");

                const data = lateFeeMissingList.map(r => ({
                    'Token ID': r.id,
                    'Student Name': r.folder,
                    'Grade': r.grade || '-',
                    'Upload / Payment Date': r.effDate ? r.effDate.toLocaleDateString() : '-',
                    'Amount Paid (LKR)': r.paid,
                    'Required Base Fee (LKR)': r.baseExpected,
                    'Missing Late Fee (LKR)': r.lateFeeAmount,
                    'OneDrive / Slip Link': r.link || '-',
                    'Matched Bank Description': r.matches && r.matches.length > 0 ? r.matches.map(m => m.desc).join(' | ') : 'N/A',
                    'Matched Bank Amount': r.matches && r.matches.length > 0 ? r.matches.map(m => `Rs.${m.amount}`).join(' | ') : '0',
                    'Auditor Comment': r.forensicNote
                }));
                const ws = XLSX.utils.json_to_sheet(data);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, "Late Fee Defaulters");
                XLSX.writeFile(wb, `Late_Fee_Defaulters_${config.auditMonth.replace(/\s+/g, '_')}.xlsx`);
                showToast("Late Fee Defaulters report generated!", "success");
            };

            // Stats Calculations
            const stats = useMemo(() => {
                const totalPaid = results.reduce((acc, r) => acc + (r.paid || 0), 0);
                const totalExpected = results.reduce((acc, r) => acc + (r.expected || 0), 0);
                const confirmedCount = results.filter(r => r.statusType === 'confirmed').length;
                const lateMissingCount = results.filter(r => r.statusType === 'late_fee_missing').length;
                const oddCount = results.filter(r => r.statusType === 'odd').length;
                const unmatchedCount = results.filter(r => r.statusType === 'unmatched').length;
                const totalCount = results.length || 1;
                const rate = Math.round((confirmedCount / totalCount) * 100);

                return { totalPaid, totalExpected, confirmedCount, lateMissingCount, oddCount, unmatchedCount, rate };
            }, [results]);

            // Filtered & Searched Results
            const filteredResults = useMemo(() => {
                return results.filter(r => {
                    const matchesFilter = activeFilter === 'all' || r.statusType === activeFilter;
                    const matchesGrade = gradeFilter === 'all' || parseGradeNumber(r.grade).toString() === gradeFilter;
                    const q = searchQuery.toLowerCase();
                    const matchesSearch = !q || 
                        r.folder.toLowerCase().includes(q) || 
                        r.id.toString().includes(q) || 
                        (r.forensicNote && r.forensicNote.toLowerCase().includes(q));
                    return matchesFilter && matchesGrade && matchesSearch;
                });
            }, [results, activeFilter, gradeFilter, searchQuery]);

            const currentSlip = useMemo(() => intervention ? processedData.receipts.find(r => r.id === intervention.id) : null, [intervention, processedData.receipts]);

            return (
                <div className="min-h-screen p-4 md:p-8 flex flex-col gap-6 max-w-[1600px] mx-auto relative">
                    
                    {/* Toast Notification Container */}
                    {toast && (
                        <div className={`fixed bottom-6 right-6 z-[300] px-5 py-3 rounded-2xl shadow-2xl border flex items-center gap-3 animate-bounce ${
                            toast.type === 'error' ? 'bg-rose-950 border-rose-800 text-rose-200' :
                            toast.type === 'success' ? 'bg-emerald-950 border-emerald-800 text-emerald-200' :
                            'bg-indigo-950 border-indigo-800 text-indigo-200'
                        }`}>
                            <i className={`fas ${
                                toast.type === 'error' ? 'fa-exclamation-circle text-rose-400' :
                                toast.type === 'success' ? 'fa-check-circle text-emerald-400' :
                                'fa-info-circle text-indigo-400'
                            }`}></i>
                            <span className="text-xs font-bold">{toast.message}</span>
                        </div>
                    )}

                    {/* Custom Confirmation Dialog Modal */}
                    {confirmDialog && (
                        <div className="fixed inset-0 z-[300] bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 p-6 rounded-3xl max-w-md w-full shadow-2xl space-y-4">
                                <h3 className="text-base font-extrabold text-white uppercase tracking-wider">{confirmDialog.title}</h3>
                                <p className="text-xs text-slate-300 leading-relaxed">{confirmDialog.message}</p>
                                <div className="flex gap-3 pt-2">
                                    <button onClick={() => setConfirmDialog(null)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl text-xs font-bold uppercase">Cancel</button>
                                    <button onClick={() => { confirmDialog.onConfirm(); setConfirmDialog(null); }} className="flex-1 bg-rose-600 hover:bg-rose-500 text-white py-2.5 rounded-xl text-xs font-bold uppercase shadow-lg shadow-rose-600/30">Confirm</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Header */}
                    <header className="glass-panel p-6 rounded-3xl flex flex-col lg:flex-row justify-between items-start lg:items-center relative overflow-hidden gap-4">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-500 via-indigo-500 to-amber-500"></div>
                        <div className="z-10">
                            <div className="flex items-center gap-2 text-indigo-400 font-mono text-xs tracking-widest uppercase mb-1">
                                <span className="w-2.5 h-2.5 bg-emerald-400 rounded-full animate-pulse"></span>
                                Smart Audit Vision Engine v23.0
                            </div>
                            <h1 className="text-3xl md:text-4xl font-extrabold text-white tracking-tight flex items-center gap-3">
                                AuditCore<span className="text-indigo-500">Pro</span>
                                <span className="text-xs bg-indigo-500/20 text-indigo-300 font-mono border border-indigo-500/30 px-2.5 py-1 rounded-full uppercase">v23.0 Enterprise</span>
                            </h1>
                            <p className="text-slate-400 font-mono text-xs mt-1">{status}</p>
                        </div>

                        <div className="flex flex-wrap items-center gap-3 z-10">
                            {lastSaved && (
                                <div className="hidden sm:flex items-center gap-2 text-slate-400 font-mono text-[11px] bg-slate-900/80 px-3 py-1.5 rounded-full border border-slate-800">
                                    <i className="fas fa-check text-emerald-400"></i> Auto-saved {lastSaved.toLocaleTimeString()}
                                </div>
                            )}
                            <button onClick={continueManualAudit} className="bg-amber-600 hover:bg-amber-500 text-white px-4 py-2.5 rounded-xl font-bold text-xs uppercase border border-amber-500/50 flex items-center gap-2 shadow-lg shadow-amber-600/20 transition-all">
                                <i className="fas fa-tasks text-amber-200"></i> Continue Manual Audit ({auditedCount}/{results.length})
                            </button>
                            <button onClick={resetSystem} className="bg-rose-950 hover:bg-rose-900 text-rose-300 px-3.5 py-2.5 rounded-xl font-bold text-xs uppercase border border-rose-800 flex items-center gap-2 transition-all">
                                <i className="fas fa-power-off text-rose-400"></i> Reset System
                            </button>
                            <button onClick={exportLateFeeReport} className="bg-rose-900/40 hover:bg-rose-900/80 text-rose-200 px-4 py-2.5 rounded-xl font-bold text-xs uppercase border border-rose-800/60 flex items-center gap-2">
                                <i className="fas fa-exclamation-circle text-rose-400"></i> Defaulters ({stats.lateMissingCount})
                            </button>
                            <button 
                                onClick={exportReport} 
                                className="bg-emerald-600 hover:bg-emerald-500 text-white border-emerald-500/50 shadow-lg shadow-emerald-600/20 px-4 py-2.5 rounded-xl font-bold text-xs uppercase border flex items-center gap-2 transition-all cursor-pointer"
                                title="Export Active Multi-Tab Excel Report"
                            >
                                <i className="fas fa-file-excel"></i> 
                                Export All Tabs
                            </button>
                            <button onClick={runSmartAudit} disabled={isAuditing} className="bg-indigo-600 hover:bg-indigo-500 active:scale-95 text-white px-6 py-2.5 rounded-xl font-bold text-xs uppercase shadow-lg shadow-indigo-500/25 flex items-center gap-2 transition-all">
                                <i className={`fas ${isAuditing ? 'fa-spinner fa-spin' : 'fa-play'}`}></i>
                                {isAuditing ? 'Auditing...' : 'Run Audit'}
                            </button>
                        </div>
                    </header>

                    {/* Metrics Top Section with Integrated Vision OCR Status Card */}
                    <div className="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-7 gap-4">
                        <div className="glass-panel p-4 rounded-2xl">
                            <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Reconciled Collections</span>
                            <div className="text-xl font-extrabold font-mono text-emerald-400 mt-1">Rs. {stats.totalPaid.toLocaleString()}</div>
                            <span className="text-[10px] text-slate-500">From verified bank credits</span>
                        </div>
                        <div className="glass-panel p-4 rounded-2xl">
                            <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Expected Total</span>
                            <div className="text-xl font-extrabold font-mono text-indigo-400 mt-1">Rs. {stats.totalExpected.toLocaleString()}</div>
                            <span className="text-[10px] text-slate-500">Base fees + Late penalties</span>
                        </div>
                        <div className="glass-panel p-4 rounded-2xl">
                            <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Match Efficiency</span>
                            <div className="text-xl font-extrabold font-mono text-white mt-1">{stats.rate}%</div>
                            <div className="w-full bg-slate-800 h-1.5 rounded-full overflow-hidden mt-1">
                                <div className="bg-emerald-500 h-full" style={{ width: `${stats.rate}%` }}></div>
                            </div>
                        </div>
                        <div className="glass-panel p-4 rounded-2xl border-rose-500/30">
                            <span className="text-[10px] font-bold uppercase tracking-wider text-rose-400">Late Fee Defaulters</span>
                            <div className="text-xl font-extrabold font-mono text-rose-400 mt-1">{stats.lateMissingCount}</div>
                            <span className="text-[10px] text-rose-300/60">Rs. {stats.lateMissingCount * config.lateFee} pending</span>
                        </div>
                        <div className="glass-panel p-4 rounded-2xl">
                            <span className="text-[10px] font-bold uppercase tracking-wider text-amber-400">Odd Discrepancies</span>
                            <div className="text-xl font-extrabold font-mono text-amber-400 mt-1">{stats.oddCount}</div>
                            <span className="text-[10px] text-slate-500">Partial/Excess payments</span>
                        </div>
                        <div className="glass-panel p-4 rounded-2xl">
                            <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400">Unmatched / Pending</span>
                            <div className="text-xl font-extrabold font-mono text-slate-400 mt-1">{stats.unmatchedCount}</div>
                            <span className="text-[10px] text-slate-500">No bank record link</span>
                        </div>
                        {/* Vertical Vision OCR Status Card */}
                        <div className="glass-panel p-4 rounded-2xl flex flex-col justify-between border-indigo-500/30">
                            <div className="flex justify-between items-center mb-1">
                                <span className="text-[10px] font-bold uppercase tracking-wider text-slate-400 flex items-center gap-1.5">
                                    <i className="fas fa-eye text-indigo-400"></i> Vision OCR Status
                                </span>
                                <div className="flex gap-1">
