                                            <textarea 
                                                value={modalNote} 
                                                onChange={e => setModalNote(e.target.value)}
                                                placeholder="Write specific observations..."
                                                className="w-full bg-slate-900 border border-slate-800 rounded-xl p-3 text-xs text-white placeholder-slate-600 outline-none focus:border-indigo-500 h-20 font-mono"
                                            />
                                        </div>

                                        <div className="flex gap-3 pt-2">
                                            <button onClick={closeReview} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs uppercase transition-all">
                                                Cancel
                                            </button>
                                            <button onClick={saveReviewAndNext} className="flex-[2] bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2.5 rounded-xl text-xs uppercase shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2 transition-all">
                                                <i className="fas fa-check-circle"></i> Save & Next Record
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Fullscreen Image Viewer Modal */}
                    {fullscreenSlip && (
                        <div className="fixed inset-0 z-[200] bg-black/95 flex flex-col items-center justify-center p-4 select-none">
                            <div className="absolute top-4 right-4 flex items-center gap-3 z-10">
                                <button onClick={() => setZoomLevel(prev => Math.min(prev + 0.5, 4))} className="w-10 h-10 rounded-xl bg-slate-800 text-white hover:bg-slate-700 flex items-center justify-center border border-slate-700" title="Zoom In">
                                    <i className="fas fa-search-plus"></i>
                                </button>
                                <button onClick={() => setZoomLevel(prev => Math.max(prev - 0.5, 0.5))} className="w-10 h-10 rounded-xl bg-slate-800 text-white hover:bg-slate-700 flex items-center justify-center border border-slate-700" title="Zoom Out">
                                    <i className="fas fa-search-minus"></i>
                                </button>
                                <button onClick={() => setRotation(prev => (prev + 90) % 360)} className="w-10 h-10 rounded-xl bg-slate-800 text-white hover:bg-slate-700 flex items-center justify-center border border-slate-700" title="Rotate 90 Degrees">
                                    <i className="fas fa-redo"></i>
                                </button>
                                <button onClick={() => setFullscreenSlip(null)} className="w-10 h-10 rounded-xl bg-rose-600 text-white hover:bg-rose-500 flex items-center justify-center border border-rose-500 shadow-lg shadow-rose-600/30" title="Close">
                                    <i className="fas fa-times"></i>
                                </button>
                            </div>
                            <div className="w-full h-full flex items-center justify-center overflow-auto p-8">
                                <img 
                                    src={fullscreenSlip.url} 
                                    style={{ transform: `scale(${zoomLevel}) rotate(${rotation}deg)`, transition: 'transform 0.2s ease-in-out' }} 
                                    className="max-w-full max-h-full object-contain shadow-2xl rounded-lg"
                                />
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
