                                                        type="text" 
                                                        value={manualTraceSearch} 
                                                        onChange={e => setManualTraceSearch(e.target.value)} 
                                                        placeholder="4-Digit TRACE (e.g. 2756)" 
                                                        className="bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-white font-mono placeholder-slate-600 outline-none focus:border-indigo-500" 
                                                    />
                                                    <input 
                                                        type="text" 
                                                        value={manualDescSearch} 
                                                        onChange={e => setManualDescSearch(e.target.value)} 
                                                        placeholder="Desc / Keyword (CRM3)" 
                                                        className="bg-slate-950 border border-slate-800 rounded px-2 py-1.5 text-xs text-white font-mono placeholder-slate-600 outline-none focus:border-indigo-500" 
                                                    />
                                                </div>

                                                {manualSearchResultTxns.length > 0 && (
                                                    <div className="space-y-1.5 mt-2 bg-slate-950 p-2 rounded-xl border border-indigo-500/30">
                                                        <span className="text-[9px] font-bold text-slate-400 uppercase block">Matching Bank Records ({manualSearchResultTxns.length})</span>
                                                        {manualSearchResultTxns.map((tx, idx) => (
                                                            <div key={idx} className="p-1.5 bg-slate-900 rounded border border-slate-800 flex items-center justify-between text-[10px] font-mono">
                                                                <div className="truncate flex-1 pr-2">
                                                                    <div className="text-slate-200 truncate font-bold">{tx.desc}</div>
                                                                    <div className="text-slate-500">{tx.date ? new Date(tx.date).toLocaleDateString() : '-'} • Rs. {tx.amount}</div>
                                                                </div>
                                                                <button 
                                                                    onClick={() => attachManualBankTxn(tx)} 
                                                                    className="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-2 py-1 rounded text-[9px] uppercase shrink-0"
                                                                >
                                                                    Attach
                                                                </button>
                                                            </div>
                                                        ))}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>

                                    <div className="text-[10px] text-slate-500 font-mono flex items-center justify-between">
                                        <span>AuditCore Forensic Report Card</span>
                                        <span>{new Date().toLocaleDateString()}</span>
                                    </div>
                                </div>

                                {/* Right Side: Visual Slip Viewer & Interactive Image Controls / Adjusters */}
                                <div className="md:w-7/12 p-6 flex flex-col bg-slate-900/40">
                                    <div className="flex-1 bg-slate-950 rounded-2xl overflow-hidden relative border border-slate-800 mb-3 flex items-center justify-center">
                                        {currentSlip ? (
                                            currentSlip.type.includes('pdf') ? (
                                                <div className="flex flex-col items-center text-slate-500">
                                                    <i className="fas fa-file-pdf text-5xl mb-2 text-rose-500"></i>
                                                    <button onClick={() => window.open(currentSlip.url)} className="mt-2 px-4 py-2 bg-indigo-600 text-white rounded-xl text-xs font-bold">Open PDF Document</button>
                                                </div>
                                            ) : (
                                                <img 
                                                    src={customPreviewUrl || currentSlip.url} 
                                                    onClick={() => { setFullscreenSlip(currentSlip); setZoomLevel(1); setRotation(0); }} 
                                                    className="w-full h-full object-contain cursor-zoom-in" 
                                                    title="Click to view full screen with zoom controls"
                                                />
                                            )
                                        ) : (
                                            <div className="text-center p-6">
                                                <i className="fas fa-file-invoice text-4xl text-slate-700 mb-2"></i>
                                                <p className="text-xs text-slate-500">No Image Slip Loaded in Local Folder</p>
                                                {intervention.link && (
                                                    <a href={intervention.link} target="_blank" rel="noreferrer" className="mt-3 inline-block px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition-all">Open Cloud Link</a>
                                                )}
                                            </div>
                                        )}

                                        {currentSlip && !currentSlip.type.includes('pdf') && (
                                            <button onClick={() => { setFullscreenSlip(currentSlip); setZoomLevel(1); setRotation(0); }} className="absolute top-4 right-4 bg-slate-900/80 hover:bg-slate-800 text-white w-9 h-9 rounded-xl flex items-center justify-center border border-slate-700" title="Full Screen View">
                                                <i className="fas fa-search-plus"></i>
                                            </button>
                                        )}
                                    </div>

                                    {/* Restored OCR Preprocessing & Image Tweaker Controls Panel */}
                                    {currentSlip && !currentSlip.type.includes('pdf') && (
                                        <div className="bg-slate-950/80 p-3 rounded-2xl border border-slate-800 mb-3 space-y-2">
                                            <div className="flex items-center justify-between">
                                                <span className="text-[10px] font-bold uppercase tracking-wider text-indigo-400 flex items-center gap-1">
                                                    <i className="fas fa-sliders-h"></i> OCR Image Preprocessing & Contrast Tweaker
                                                </span>
                                                <button
                                                    onClick={rescanModalImageWithAdjuster}
                                                    disabled={isRescanning}
                                                    className="px-3 py-1 bg-indigo-600 hover:bg-indigo-500 text-white text-[10px] font-bold uppercase rounded-lg border border-indigo-400/40 flex items-center gap-1.5 transition-all shadow-md"
                                                >
                                                    <i className={`fas ${isRescanning ? 'fa-spinner fa-spin' : 'fa-sync'}`}></i>
                                                    {isRescanning ? 'Scanning...' : 'Rescan OCR with Adjustments'}
                                                </button>
                                            </div>
                                            <div className="grid grid-cols-3 gap-3 text-[10px] font-mono text-slate-400">
                                                <div>
                                                    <div className="flex justify-between mb-0.5">
                                                        <span>Contrast</span>
                                                        <span className="text-indigo-300 font-bold">{imgContrast.toFixed(1)}</span>
                                                    </div>
                                                    <input 
                                                        type="range" min="0.5" max="3.0" step="0.1" 
                                                        value={imgContrast} 
                                                        onChange={e => setImgContrast(parseFloat(e.target.value))} 
                                                        className="w-full accent-indigo-500 h-1 bg-slate-800 rounded" 
                                                    />
                                                </div>
                                                <div>
                                                    <div className="flex justify-between mb-0.5">
                                                        <span>Brightness</span>
                                                        <span className="text-indigo-300 font-bold">{imgBrightness}</span>
                                                    </div>
                                                    <input 
                                                        type="range" min="-100" max="100" step="5" 
                                                        value={imgBrightness} 
                                                        onChange={e => setImgBrightness(parseInt(e.target.value))} 
                                                        className="w-full accent-indigo-500 h-1 bg-slate-800 rounded" 
                                                    />
                                                </div>
                                                <div>
                                                    <div className="flex justify-between mb-0.5">
                                                        <span>Threshold</span>
                                                        <span className="text-indigo-300 font-bold">{imgThreshold}</span>
                                                    </div>
                                                    <input 
                                                        type="range" min="50" max="220" step="5" 
                                                        value={imgThreshold} 
                                                        onChange={e => setImgThreshold(parseInt(e.target.value))} 
                                                        className="w-full accent-indigo-500 h-1 bg-slate-800 rounded" 
                                                    />
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Action Bar */}
                                    <div className="bg-slate-950 rounded-2xl p-4 border border-slate-800 space-y-3">
                                        <div className="flex flex-wrap gap-1.5">
                                            {STANDARD_COMMENTS.map(tag => (
                                                <button key={tag} onClick={() => setModalNote(tag)} className="px-2.5 py-1 bg-slate-900 border border-slate-800 rounded-lg text-[10px] font-bold uppercase text-slate-400 hover:bg-indigo-600 hover:text-white transition-colors">{tag}</button>
                                            ))}
                                        </div>
                                        <input
                                            value={modalNote}
                                            onChange={e => setModalNote(e.target.value)}
                                            placeholder="Write custom audit note or remark..."
                                            className="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-white outline-none focus:border-indigo-500"
                                        />
                                        <div className="flex gap-3">
                                            <button onClick={closeReview} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 py-2.5 rounded-xl font-bold text-xs uppercase">Cancel</button>
                                            <button onClick={saveReviewAndNext} className="flex-2 bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl font-bold text-xs uppercase px-8 shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2">
                                                <span>Confirm & Next</span>
                                                <i className="fas fa-arrow-right text-xs"></i>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Fullscreen Slip Evidence Viewer */}
                    {fullscreenSlip && (
                        <div className="fixed inset-0 z-[200] bg-black/95 flex flex-col animate-fade-in">
                            <div className="h-16 flex justify-between items-center px-6 border-b border-white/10 bg-slate-950">
                                <div className="text-white font-bold text-sm font-mono">{fullscreenSlip.name}</div>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setRotation(r => (r + 90) % 360)} className="text-slate-400 hover:text-white p-2" title="Rotate"><i className="fas fa-redo"></i></button>
                                    <button onClick={() => setFullscreenSlip(null)} className="text-slate-400 hover:text-white p-2"><i className="fas fa-times text-xl"></i></button>
                                </div>
                            </div>
                            <div className="flex-1 overflow-auto p-8 flex items-center justify-center bg-neutral-950">
                                <img
                                    src={fullscreenSlip.url}
                                    className="max-w-none shadow-2xl transition-transform duration-200 ease-out"
                                    style={{ transform: `scale(${zoomLevel}) rotate(${rotation}deg)` }}
                                />
                            </div>
                            <div className="absolute bottom-8 left-1/2 -translate-x-1/2 bg-slate-900/90 backdrop-blur rounded-full px-6 py-2.5 flex items-center gap-6 shadow-2xl border border-slate-800">
                                <button onClick={() => setZoomLevel(z => Math.max(0.5, z - 0.25))} className="text-white hover:text-indigo-400 text-xl font-bold">-</button>
                                <span className="text-indigo-400 font-mono text-xs font-bold min-w-[3rem] text-center">{Math.round(zoomLevel * 100)}%</span>
                                <button onClick={() => setZoomLevel(z => Math.min(4, z + 0.25))} className="text-white hover:text-indigo-400 text-xl font-bold">+</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
